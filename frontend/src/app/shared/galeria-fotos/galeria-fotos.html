<div class="galeria" [class]="'galeria--' + disposicion()">
  @for (foto of visibles(); track foto.id; let i = $index) {
    <button type="button" class="mosaico" [class.mosaico--principal]="i === 0" (click)="abrir(i)">
      <!-- La foto grande usa el tamaño de galería; las pequeñas, la miniatura. El nombre accesible lo da el texto oculto. -->
      <img
        [src]="i === 0 ? foto.url : foto.urlMiniatura"
        alt=""
        [attr.loading]="i === 0 ? 'eager' : 'lazy'"
      />
      <span class="solo-lectores">{{
        'compartido.galeria.verFoto' | t: { indice: i + 1, total: total() }
      }}</span>
      @if (i === 2 && total() > 3) {
        <span class="mosaico__mas">{{ 'compartido.galeria.verTodas' | t: { total: total() } }}</span>
      }
      @if (i === 0 && total() > 1) {
        <span class="mosaico__mas mosaico__mas--movil">{{
          'compartido.galeria.verTodas' | t: { total: total() }
        }}</span>
      }
    </button>
  }
</div>

<dialog
  #visor
  class="visor"
  [attr.aria-label]="'compartido.galeria.etiqueta' | t: { nombre: nombre() }"
  (close)="alCerrar()"
  (keydown)="teclado($event)"
  (click)="cerrarSiFuera($event)"
>
  <button type="button" class="visor__cerrar" (click)="cerrar()">
    {{ 'comun.cerrar' | t }}<span class="solo-lectores"> {{ 'compartido.galeria.laGaleria' | t }}</span>
  </button>

  @if (total() > 1) {
    <button type="button" class="visor__nav visor__nav--anterior" (click)="ir(-1)">
      <app-icono nombre="chevron" />
      <span class="solo-lectores">{{ 'compartido.galeria.anterior' | t }}</span>
    </button>
  } @else {
    <span></span>
  }

  <div class="visor__escenario">
    @if (actual(); as foto) {
      <img class="visor__foto" [src]="foto.url" [alt]="textoAlternativo(indice())" />
    }
    <p class="visor__pie" aria-live="polite">
        {{ 'compartido.galeria.posicion' | t: { indice: indice() + 1, total: total() } }}
      </p>
  </div>

  @if (total() > 1) {
    <button type="button" class="visor__nav" (click)="ir(1)">
      <app-icono nombre="chevron" />
      <span class="solo-lectores">{{ 'compartido.galeria.siguiente' | t }}</span>
    </button>
  } @else {
    <span></span>
  }
</dialog>
