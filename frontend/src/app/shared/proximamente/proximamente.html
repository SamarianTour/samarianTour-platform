<section class="pronto">
  <div class="pronto__caja">
    <span class="pronto__icono" aria-hidden="true"><app-icono nombre="hoja" /></span>
    @if (codigo(); as pantalla) {
      <p class="rotulo">{{ pantalla }}</p>
    }
    <h1>{{ nombre() | t }}</h1>
    <p class="pronto__texto">{{ descripcion() | t }}</p>
    <p class="pronto__estado">{{ 'compartido.proximamente.estado' | t }}</p>
    <a class="boton" routerLink="/catalogo">{{ 'compartido.proximamente.volver' | t }}</a>
  </div>
</section>
