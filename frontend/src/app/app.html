<a class="saltar" href="#contenido">{{ 'app.saltar' | t }}</a>

<header class="cabecera">
  <div class="cabecera__interior">
    <a class="marca" routerLink="/">
      <span class="marca__logo"><app-icono nombre="hoja" /></span>
      Samarian Tour
    </a>
    <nav [attr.aria-label]="'app.nav.principal' | t">
      <ul class="navegacion">
        @for (enlace of enlaces(); track enlace.ruta) {
          <li>
            <a
              [routerLink]="enlace.ruta"
              [queryParams]="enlace.consulta"
              [class.activo]="esActivo(enlace)"
              [attr.aria-current]="esActivo(enlace) ? 'page' : null"
            >
              {{ enlace.clave | t }}
            </a>
          </li>
        }
      </ul>
    </nav>
    <div class="cabecera__cuenta">
      <app-selector-idioma />
      @if (autenticada()) {
        <app-menu-usuario />
      } @else {
        <a class="boton boton--secundario" routerLink="/iniciar-sesion">{{ 'app.cuenta.iniciarSesion' | t }}</a>
        <a class="boton" routerLink="/registro">{{ 'app.cuenta.registrarse' | t }}</a>
      }
    </div>
  </div>
</header>

<main id="contenido" tabindex="-1">
  <router-outlet />
</main>

<footer class="pie">
  <div class="pie__arriba">
    <div class="pie__interior">
      <span class="marca">
        <span class="marca__logo"><app-icono nombre="hoja" /></span>
        Samarian Tour
      </span>
      <p>{{ 'app.pie.lema' | t }}</p>
    </div>
  </div>
  <div class="pie__abajo">
    <div class="pie__interior">
      <p>© 2026 Samarian Tour</p>
    </div>
  </div>
</footer>

<app-avisos />
