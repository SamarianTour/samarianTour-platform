<a class="saltar" href="#contenido">Saltar al contenido</a>

<header class="cabecera">
  <div class="cabecera__interior">
    <a class="marca" routerLink="/">
      <span class="marca__logo"><app-icono nombre="hoja" /></span>
      Samarian Tour
    </a>
    <nav aria-label="Principal">
      <ul class="navegacion">
        <li>
          <a routerLink="/" [class.activo]="seccion() === 'catalogo'" [attr.aria-current]="seccion() === 'catalogo' ? 'page' : null">
            Catálogo
          </a>
        </li>
        @if (turista()) {
          <li>
            <a
              routerLink="/mis-opiniones"
              [class.activo]="seccion() === 'opiniones'"
              [attr.aria-current]="seccion() === 'opiniones' ? 'page' : null"
            >
              Mis opiniones
            </a>
          </li>
        }
        <li>
          <a
            routerLink="/prestador/ofertas"
            [class.activo]="seccion() === 'prestador'"
            [attr.aria-current]="seccion() === 'prestador' ? 'page' : null"
          >
            Soy prestador
          </a>
        </li>
      </ul>
    </nav>
    <app-usuario-demo class="cabecera__usuario" />
  </div>
</header>

<main id="contenido" tabindex="-1">
  <router-outlet />
</main>

<footer class="pie">
  <div class="pie__arriba">
    <div class="pie__interior">
      <span class="marca">
        <span class="marca__logo"><app-icono nombre="hoja" /></span>
        Samarian Tour
      </span>
      <p>Turismo sostenible en Santa Marta</p>
    </div>
  </div>
  <div class="pie__abajo">
    <div class="pie__interior">
      <p>© 2026 Samarian Tour</p>
    </div>
  </div>
</footer>

<app-avisos />
