<section class="pagina">
  <div class="tarjeta vacio" role="alert">
    <span class="aviso-icono" aria-hidden="true"><app-icono nombre="escudo" /></span>
    <h1>{{ 'cuentas.sinPermiso.titulo' | t }}</h1>
    @if (rol(); as actual) {
      <p class="texto-suave">
        {{ 'cuentas.sinPermiso.entraste' | t }} <strong>{{ etiquetaRol[actual] }}</strong
        >{{ 'cuentas.sinPermiso.explicacion' | t }}
      </p>
      <div class="acciones">
        <a class="boton" [routerLink]="inicio[actual]">{{ 'cuentas.sinPermiso.irInicio' | t }}</a>
        <button type="button" class="boton boton--secundario" (click)="cambiarDeCuenta()">
          {{ 'cuentas.sinPermiso.otraCuenta' | t }}
        </button>
      </div>
    }
  </div>
</section>
