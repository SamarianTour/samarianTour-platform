<app-pagina-acceso
  [titulo]="'cuentas.login.titulo' | t"
  [subtitulo]="'cuentas.login.subtitulo' | t"
>
  <form class="formulario" [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
    @if (error(); as mensaje) {
      <p class="alerta alerta--error" role="alert">
        <app-icono nombre="alerta" />
        <span>{{ mensaje() }}</span>
      </p>
    }

    <div class="campo">
      <label for="correo">{{ 'cuentas.campo.correo' | t }}</label>
      <input
        id="correo"
        type="email"
        formControlName="correo"
        autocomplete="email"
        autocapitalize="none"
        aria-required="true"
        [attr.aria-invalid]="errorDe('correo') ? 'true' : null"
        [attr.aria-describedby]="errorDe('correo') ? 'correo-error' : null"
      />
      @if (errorDe('correo'); as mensaje) {
        <p class="campo__error" id="correo-error">{{ mensaje }}</p>
      }
    </div>

    <div class="campo">
      <label for="contrasena">{{ 'cuentas.campo.contrasena' | t }}</label>
      <input
        id="contrasena"
        type="password"
        formControlName="contrasena"
        autocomplete="current-password"
        aria-required="true"
        [attr.aria-invalid]="errorDe('contrasena') ? 'true' : null"
        [attr.aria-describedby]="errorDe('contrasena') ? 'contrasena-error' : null"
      />
      @if (errorDe('contrasena'); as mensaje) {
        <p class="campo__error" id="contrasena-error">{{ mensaje }}</p>
      }
    </div>

    <div class="opciones">
      <label class="opcion">
        <input type="checkbox" formControlName="recordar" />
        <span>{{ 'cuentas.login.recordar' | t }}</span>
      </label>
      <a routerLink="/recuperar-contrasena">{{ 'cuentas.login.olvido' | t }}</a>
    </div>

    <button type="submit" class="boton boton--ancho" [disabled]="enviando()">
      {{ (enviando() ? 'cuentas.login.entrando' : 'cuentas.login.entrar') | t }}
    </button>
  </form>

  <p pie>
    {{ 'cuentas.login.sinCuenta' | t }}
    <a routerLink="/registro">{{ 'cuentas.login.crear' | t }}</a>
  </p>
</app-pagina-acceso>
