<dialog #dialogo class="visor" aria-labelledby="visor-politica-titulo">
  <header class="visor__cabecera">
    <h2 id="visor-politica-titulo">{{ 'cuentas.politica.titulo' | t }}</h2>
    <p class="texto-suave">{{ 'cuentas.politica.version' | t: { version: version() } }}</p>
  </header>

  <div
    class="visor__cuerpo"
    tabindex="0"
    [attr.aria-label]="'cuentas.politica.region' | t"
    role="region"
    aria-live="polite"
    [attr.aria-busy]="cargando()"
  >
    @if (cargando()) {
      <p class="texto-suave">{{ 'cuentas.politica.cargando' | t }}</p>
    } @else if (error(); as mensaje) {
      <p class="alerta alerta--error" role="alert">
        <span>{{ mensaje() }}</span>
      </p>
      <button type="button" class="boton boton--secundario" (click)="cargar()">
        {{ 'comun.reintentar' | t }}
      </button>
    } @else if (texto(); as contenido) {
      <div class="visor__texto">{{ contenido }}</div>
    }
  </div>

  <footer class="visor__pie">
    <button type="button" class="boton" (click)="cerrar()">{{ 'comun.cerrar' | t }}</button>
  </footer>
</dialog>
