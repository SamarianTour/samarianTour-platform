<aside class="lateral">
  <div class="identidad">
    <span class="identidad__avatar" aria-hidden="true">{{ inicial() }}</span>
    <div class="identidad__datos">
      <p class="rotulo">Prestador</p>
      <p class="identidad__nombre">{{ prestador().nombre }}</p>
      <p class="identidad__tipo">{{ etiquetaTipo[prestador().tipo] }}</p>
    </div>
  </div>

  <div class="campo">
    <label for="prestador-demo">Prestador demo</label>
    <select id="prestador-demo" aria-describedby="prestador-demo-ayuda" #selector (change)="elegir(selector.value)">
      @for (opcion of prestadores; track opcion.id) {
        <option [value]="opcion.id" [selected]="opcion.id === prestador().id">
          {{ opcion.nombre }} · {{ etiquetaTipo[opcion.tipo] }}
        </option>
      }
    </select>
    <p class="campo__ayuda" id="prestador-demo-ayuda">Identidad de demostración: todavía no hay inicio de sesión.</p>
  </div>

  <nav aria-labelledby="panel-titulo">
    <p class="rotulo" id="panel-titulo">Panel de control</p>
    <ul class="menu">
      <li>
        <a routerLink="/prestador/ofertas" [class.activo]="!enPublicar()" [attr.aria-current]="enPublicar() ? null : 'page'">
          <app-icono nombre="paquete" />
          Mis ofertas
        </a>
      </li>
      <li>
        <a
          routerLink="/prestador/ofertas/nueva"
          [class.activo]="enPublicar()"
          [attr.aria-current]="enPublicar() ? 'page' : null"
        >
          <app-icono nombre="mas" />
          Publicar oferta
        </a>
      </li>
    </ul>
  </nav>
</aside>

<div class="contenido">
  <router-outlet />
</div>
