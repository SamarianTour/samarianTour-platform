name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compila los tres servicios y corre las pruebas: unitarias, ArchUnit e integración con Testcontainers
      # (MongoDB para el catálogo y PostgreSQL para el núcleo).
      - name: Compilar y probar
        run: mvn -B verify

      - name: Construir imagen del catálogo
        run: docker build -f servicios/catalogo/Dockerfile -t samarian-tour/catalogo:ci .

      - name: Construir imagen del núcleo
        run: docker build -f servicios/nucleo/Dockerfile -t samarian-tour/nucleo:ci .

      # Sin key ni proveedor: el CI nunca llama a la IA (las pruebas usan un servidor simulado).
      - name: Construir imagen de la recomendación
        run: docker build -f servicios/recomendacion/Dockerfile -t samarian-tour/recomendacion:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # Los tipos de la API se generan desde contratos/catalogo.openapi.yaml y están versionados:
      # si el contrato cambió y no se regeneraron, el build falla aquí.
      - name: Generar tipos desde el contrato
        run: npm run gen:api

      - name: Verificar que los tipos versionados están al día
        run: git diff --exit-code -- src/app/core/api/catalogo-api.ts

      - name: Compilar
        run: npm run build

      - name: Probar
        run: npm test -- --no-watch
