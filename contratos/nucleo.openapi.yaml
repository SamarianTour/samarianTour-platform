openapi: 3.0.3
info:
  title: Samarian Tour · Núcleo
  version: 0.2.0
  description: |
    API del núcleo transaccional: cuentas, solicitudes de disponibilidad, pagos, prestadores, administración e
    indicadores. Hoy tiene las cuentas (módulo 1), la moderación (módulo 8) y las solicitudes de disponibilidad (módulo
    4); cada módulo agrega
    aquí sus rutas antes de escribir su código (API first), y `ContratoNucleoIT` falla si una ruta existe en el
    contrato y no en los controladores, o al revés.

    - Las rutas no incluyen el prefijo `/api/nucleo`: es el context-path del servicio y va en `servers`.
    - Los errores salen como `application/problem+json` (RFC 7807) con la propiedad `codigo`.
    - Las rutas `/turista/**`, `/prestador/**`, `/admin/**`, `/operador/**` y `/gestor/**` exigen la identidad del
      usuario con el rol TURISTA, PRESTADOR, ADMINISTRADOR, OPERADOR_DISPONIBILIDAD o GESTOR_DESTINO,
      respectivamente (DN-04, DN-05); `/cuenta/**` admite cualquiera de los cinco. Sin identidad responden 401
      `NO_AUTENTICADO`; con otro rol, 403
      `ACCESO_DENEGADO`. Las demás rutas son públicas, salvo `/internal/**`, que Nginx no expone.
servers:
  - url: http://localhost:8080/api/nucleo
    description: Piloto con Docker Compose, detrás de Nginx
tags:
  - name: Cuentas
    description: Módulo 1 (RF-01 a RF-13).
  - name: Solicitudes
    description: |
      Módulo 4 (RF-30 a RF-45): el turista envía, consulta y responde; el operador de disponibilidad atiende su cola.
      Enviar y responder las condiciones exigen `Idempotency-Key` (ADR-04, DN-12).
  - name: Pagos
    description: Módulo 5 (RF-46 a RF-58).
  - name: Prestadores
    description: Módulo 7 (RF-62, RF-63, RF-68 a RF-71, RF-73 a RF-75).
  - name: Administración
    description: Módulo 8 (RF-76 a RF-83).
  - name: Indicadores
    description: Módulo 9 (RF-85 a RF-89).

paths:
  /cuentas/registro:
    post:
      tags: [Cuentas]
      operationId: registrar
      summary: Un turista o un prestador se registra (RF-01 a RF-03, RF-09 a RF-11)
      description: |
        Pública. Exige aceptar la versión vigente de la política de datos, que se lee en `GET /politica-datos/vigente`
        (RF-09, RF-10). Al turista se le envía por WhatsApp un código de 6 dígitos para verificar su número
        (`POST /turista/whatsapp/verificacion`); mientras no lo verifique no puede enviar solicitudes (RF-30). El
        prestador no registra aquí su WhatsApp ni su RNT: son de sus datos de prestador (módulo 7). Las cuentas de
        administrador, operador y gestor no se registran solas (RF-01, RF-81).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            example:
              rol: TURISTA
              nombre: Laura Gómez
              correo: laura.gomez@correo.co
              contrasena: Playa2026
              whatsapp: '+573001234567'
              aceptaPolitica: true
              versionPolitica: v1
      responses:
        '201':
          description: La cuenta creada, activa y con la política aceptada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
              example:
                id: 3f2b8c1d-6e4a-4b7c-9d2e-1a0f5c8b7e60
                rol: TURISTA
                nombre: Laura Gómez
                correo: laura.gomez@correo.co
                whatsapp: '+573001234567'
                whatsappVerificado: false
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '409':
          description: |
            `CORREO_YA_REGISTRADO`: otra cuenta tiene el correo, sin importar mayúsculas (RF-02).
            `POLITICA_NO_VIGENTE`: se aceptó una versión que ya no es la vigente; hay que leer y aceptar la nueva.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: Ya hay una cuenta con el correo laura.gomez@correo.co
                codigo: CORREO_YA_REGISTRADO
  /cuentas/sesion:
    post:
      tags: [Cuentas]
      operationId: iniciarSesion
      summary: Inicia sesión con el correo y la contraseña (RF-04, RF-05)
      description: |
        Pública. Entrega un token de acceso (JWT RS256 de 15 minutos, para `Authorization: Bearer`) y un token de
        renovación (7 días sin usarse; sirve una sola vez) (DN-29). Cinco fallos consecutivos bloquean la cuenta 15
        minutos (RF-05); mientras tanto la contraseña no se revisa.

        El token de acceso lleva `sub` (el usuario), `rol`, `sid` (la sesión), `iss` (`samarian-tour-nucleo`),
        `iat` y `exp`. Mientras los servicios no lo validen (PR de seguridad-jwt), las rutas protegidas siguen
        usando los headers de la demo (DN-05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InicioSesionRequest'
            example:
              correo: laura@demo.samariantour.co
              contrasena: Demo1234
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '401':
          description: "`CREDENCIALES_INVALIDAS`: el correo o la contraseña no son correctos; no dice cuál."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: El correo o la contraseña no son correctos
                codigo: CREDENCIALES_INVALIDAS
        '403':
          description: "`CUENTA_DESACTIVADA`: la contraseña es correcta, pero el administrador dio de baja la cuenta (RF-81)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '423':
          description: "`CUENTA_BLOQUEADA`: cinco fallos consecutivos; `bloqueadaHasta` dice hasta cuándo (RF-05)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                type: about:blank
                title: Locked
                status: 423
                detail: La cuenta está bloqueada por intentos fallidos hasta 2026-10-28T15:15:00Z
                codigo: CUENTA_BLOQUEADA
                bloqueadaHasta: '2026-10-28T15:15:00Z'
  /cuentas/sesion/renovacion:
    post:
      tags: [Cuentas]
      operationId: renovarSesion
      summary: Pide tokens nuevos con el token de renovación, sin la contraseña (RF-04)
      description: |
        Pública. Entrega un token de acceso nuevo y también un token de renovación nuevo: el usado deja de servir. Si
        llega un token de renovación que ya se usó, la sesión se cierra, porque es señal de que se filtró (DN-29).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRenovacionRequest'
      responses:
        '200':
          $ref: '#/components/responses/SesionIniciada'
        '401':
          $ref: '#/components/responses/SesionInvalida'
  /cuentas/sesion/cierre:
    post:
      tags: [Cuentas]
      operationId: cerrarSesion
      summary: Cierra la sesión (RF-06)
      description: |
        Pública. El token de renovación deja de servir; el token de acceso ya emitido vence solo, en 15 minutos como
        máximo (DN-29). Responde 204 también con un token que no sirve: la sesión queda cerrada de todas formas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRenovacionRequest'
      responses:
        '204':
          description: Sesión cerrada.
  /cuentas/contrasena/restablecimiento:
    post:
      tags: [Cuentas]
      operationId: solicitarRestablecimiento
      summary: Envía al correo un enlace para poner una contraseña nueva (RF-07)
      description: |
        Pública. Responde 202 exista o no una cuenta activa con ese correo, para no revelar qué correos están
        registrados. El enlace lleva a la pantalla del frontend `/restablecer-contrasena?token=...`, vence a los 30
        minutos y sirve una sola vez (RF-08); pedir otro invalida los anteriores (DN-30). En el piloto el correo llega a
        Mailpit, en `http://localhost:8025`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRestablecimientoRequest'
            example:
              correo: laura@demo.samariantour.co
      responses:
        '202':
          description: Si el correo es de una cuenta activa, el enlace va en camino.
        '503':
          description: "`CORREO_NO_DISPONIBLE`: el servidor de correo no respondió; no se guardó nada y se puede reintentar."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
  /cuentas/contrasena:
    post:
      tags: [Cuentas]
      operationId: restablecerContrasena
      summary: Pone la contraseña nueva con el token del enlace del correo (RF-08)
      description: |
        Pública. Gasta el enlace, quita el bloqueo por intentos fallidos y cierra todas las sesiones abiertas de la
        cuenta (DN-30).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaContrasenaRequest'
      responses:
        '204':
          description: Contraseña cambiada; hay que iniciar sesión con ella.
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '409':
          description: "`CODIGO_NO_VIGENTE`: el enlace no existe, venció, ya se usó o se pidió uno más reciente."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
  /cuenta:
    get:
      tags: [Cuentas]
      operationId: consultarCuenta
      summary: Los datos personales del usuario identificado, de cualquier rol (RF-12)
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/RolCualquiera'
      responses:
        '200':
          description: Su cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/CuentaNoEncontrada'
    put:
      tags: [Cuentas]
      operationId: actualizarCuenta
      summary: Actualiza el nombre y, el turista, su WhatsApp (RF-12)
      description: |
        Reemplaza los dos campos. Un WhatsApp distinto queda sin verificar y recibe un código nuevo (RF-03): hasta
        verificarlo, el turista no puede enviar solicitudes. El correo no se cambia (DN-31).
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/RolCualquiera'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosPersonalesRequest'
            example:
              nombre: Laura Gómez Ruiz
              whatsapp: '+573001234567'
      responses:
        '200':
          description: La cuenta actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/CuentaNoEncontrada'
        '409':
          $ref: '#/components/responses/Conflicto'
  /turista/supresion:
    post:
      tags: [Cuentas]
      operationId: suprimirCuenta
      summary: El turista elimina sus datos personales, de inmediato (RF-13, Ley 1581)
      description: |
        Confirma con la contraseña actual (DN-31). La cuenta queda anonimizada y no se puede volver a usar: el nombre,
        el correo, la contraseña y el WhatsApp se borran, se cierran todas las sesiones y el catálogo recibe el aviso
        para borrar sus opiniones (DC-45). Queda la constancia de la petición y de las aceptaciones de la política
        (RNF-09). Las solicitudes conservan solo el identificador del turista. Con el mismo correo se puede registrar
        una cuenta nueva.
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupresionRequest'
      responses:
        '204':
          description: Datos suprimidos.
        '401':
          description: "`CONTRASENA_INCORRECTA`: la contraseña no es correcta; el fallo cuenta para el bloqueo (RF-05). También `NO_AUTENTICADO`."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/CuentaNoEncontrada'
        '423':
          description: "`CUENTA_BLOQUEADA`: cinco fallos consecutivos (RF-05)."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
  /politica-datos/vigente:
    get:
      tags: [Cuentas]
      operationId: politicaVigente
      summary: La versión de la política de datos que hay que aceptar para registrarse (RF-09 a RF-11)
      description: Pública.
      responses:
        '200':
          description: La versión vigente y dónde leer su texto.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaDatos'
              example:
                version: v1
                fechaPublicacion: '2026-10-28'
                urlTexto: /api/nucleo/politica-datos/v1
  /politica-datos/{version}:
    get:
      tags: [Cuentas]
      operationId: textoPolitica
      summary: El texto completo de una versión de la política, en Markdown (RF-09, RF-11)
      description: |
        Pública. Declara, entre otras cosas, la transferencia del nombre y el WhatsApp del turista al prestador cuando
        una solicitud queda pagada (RF-11).
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9.]{1,20}$'
          example: v1
      responses:
        '200':
          description: El texto de esa versión.
          content:
            text/markdown:
              schema:
                type: string
        '404':
          description: No hay una versión con ese nombre.
  /turista/whatsapp/codigo:
    post:
      tags: [Cuentas]
      operationId: enviarCodigoWhatsapp
      summary: Envía otro código para verificar el WhatsApp (RF-03)
      description: |
        El código anterior deja de servir. Si el número ya está verificado no envía nada. El código vale 30 minutos
        (RF-08) y admite 3 intentos [SUPUESTO] (DN-28). Mientras WhatsApp sea simulado, el código sale en el log del
        núcleo.
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
      responses:
        '202':
          description: Código enviado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/CuentaNoEncontrada'
  /turista/whatsapp/verificacion:
    post:
      tags: [Cuentas]
      operationId: verificarWhatsapp
      summary: El turista confirma su WhatsApp con el código (RF-03)
      description: Verificar un número ya verificado responde 200 sin cambiar nada.
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificacionWhatsappRequest'
            example:
              codigo: '048213'
      responses:
        '200':
          description: La cuenta con el WhatsApp verificado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cuenta'
        '400':
          description: |
            `CODIGO_INCORRECTO`: el código no coincide; `intentosRestantes` dice cuántos quedan. Al tercer error el
            código queda invalidado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: El código no es correcto; quedan 2 intentos
                codigo: CODIGO_INCORRECTO
                intentosRestantes: 2
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/CuentaNoEncontrada'
        '409':
          description: "`CODIGO_NO_VIGENTE`: el código venció, ya se usó o agotó sus intentos; hay que pedir otro."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
              example:
                type: about:blank
                title: Conflict
                status: 409
                detail: "El código venció, ya se usó o agotó sus intentos: pide uno nuevo"
                codigo: CODIGO_NO_VIGENTE
  /admin/moderacion/ofertas/{ofertaId}/decision:
    post:
      tags: [Administración]
      operationId: moderarOferta
      summary: Aprobar o rechazar la versión en moderación de una oferta (RF-79)
      description: |
        El administrador lee la cola en el catálogo (`GET /api/catalogo/admin/moderacion/ofertas`) y decide aquí
        (DN-08). El núcleo verifica con el catálogo que esa versión siga en moderación, guarda la decisión y envía
        al catálogo el aviso de moderación por la bandeja de salida, que la aplica en los siguientes segundos. Un
        rechazo se notifica al prestador con su motivo.

        Repetir la misma decisión sobre la misma versión responde 200 con la decisión de entonces, aunque el catálogo
        ya la haya aplicado; tomar la contraria responde 409 `MODERACION_YA_DECIDIDA`.
      parameters:
        - name: ofertaId
          in: path
          required: true
          schema:
            type: string
          example: b00000000000000000000017
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionOfertaRequest'
            example:
              numeroVersion: 1
              decision: RECHAZAR
              motivo: Falta el punto de encuentro
      responses:
        '200':
          description: La decisión guardada, o la que ya se había tomado igual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionModeracion'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEstaEnModeracion'
        '409':
          $ref: '#/components/responses/ConflictoModeracion'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'

  /admin/moderacion/opiniones/{opinionId}/decision:
    post:
      tags: [Administración]
      operationId: moderarOpinion
      summary: Aprobar o rechazar una opinión en moderación (RF-80)
      description: |
        Como las ofertas, sin número de versión: una opinión no se edita (DC-42 del catálogo). Un rechazo se notifica
        al turista con su motivo (DN-08).
      parameters:
        - name: opinionId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionOpinionRequest'
      responses:
        '200':
          description: La decisión guardada, o la que ya se había tomado igual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionModeracion'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEstaEnModeracion'
        '409':
          $ref: '#/components/responses/ConflictoModeracion'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'

  /turista/solicitudes:
    post:
      tags: [Solicitudes]
      operationId: enviarSolicitud
      summary: Enviar una solicitud de disponibilidad sobre una oferta (RF-30 a RF-32, RF-34)
      description: |
        La solicitud queda Pendiente, asignada al operador vinculado al prestador (RF-32), con 24 h para atenderla
        (`venceEn`). El turista debe tener su WhatsApp verificado: es su único canal y no se vuelve a pedir (RF-03).

        - **Oferta:** se consulta al catálogo, con corte de circuito de 3 s (ADR-04). Si no está visible, 404
          `OFERTA_NO_ENCONTRADA`; si el catálogo no responde, 503 `CATALOGO_NO_DISPONIBLE` y no se crea nada.
        - **Fecha:** al menos 2 días calendario después del envío, en la hora de Colombia (RF-30).
        - **Campos del tipo de oferta (RF-30):** la actividad y el paquete piden `horaSalida`, una de sus
          `horariosSalida`; el alojamiento, `fechaSalida` (posterior a la de inicio) y `numeroUnidades` (entero
          positivo); el restaurante, `horaReserva`. Un campo que falta o que no corresponde al tipo es 400
          `DATO_INVALIDO`.
        - **Personas:** de 1 a la capacidad máxima de la oferta.
        - **No duplicado:** una segunda solicitud abierta del mismo turista para la misma oferta, fecha de inicio y hora
          (la de salida o la de la reserva; el alojamiento, solo por la fecha) es 409 `SOLICITUD_DUPLICADA` (RF-31).
        - **Idempotencia:** la misma `Idempotency-Key` con el mismo cuerpo devuelve la respuesta original, con
          `Idempotency-Replayed: true`, sin crear otra; con otro cuerpo, 422. Si la solicitud no se creó (por ejemplo,
          el catálogo no respondió), el reintento con la misma clave vuelve a intentarlo.

        El operador recibe un aviso en la plataforma (RF-34) y el turista, una notificación por WhatsApp (RF-44).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnviarSolicitudRequest'
            examples:
              actividad:
                summary: Actividad o paquete, con su horario de salida
                value:
                  ofertaId: b00000000000000000000001
                  fechaInicio: '2026-10-28'
                  horaSalida: '07:00'
                  personas: 2
                  nota: Vamos con una niña de 8 años
              alojamiento:
                summary: Alojamiento, con la fecha de salida y las unidades
                value:
                  ofertaId: b0000000000000000000000f
                  fechaInicio: '2026-10-28'
                  fechaSalida: '2026-10-30'
                  numeroUnidades: 1
                  personas: 3
              restaurante:
                summary: Restaurante, con la hora de la reserva
                value:
                  ofertaId: b00000000000000000000013
                  fechaInicio: '2026-10-28'
                  horaReserva: '19:30'
                  personas: 4
      responses:
        '201':
          description: La solicitud creada, o la original si la clave ya se había usado con el mismo cuerpo.
          headers:
