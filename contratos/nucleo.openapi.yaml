openapi: 3.0.3
info:
  title: Samarian Tour · Núcleo
  version: 0.1.0
  description: |
    API del núcleo transaccional: cuentas, solicitudes de disponibilidad, pagos, prestadores, administración e
    indicadores. Por ahora solo tiene la base del servicio; cada módulo agrega aquí sus rutas antes de escribir su
    código (API first), y `ContratoNucleoIT` falla si una ruta existe en el contrato y no en los controladores, o al
    revés.

    - Las rutas no incluyen el prefijo `/api/nucleo`: es el context-path del servicio y va en `servers`.
    - Los errores salen como `application/problem+json` (RFC 7807) con la propiedad `codigo`.
    - Las rutas `/turista/**`, `/prestador/**`, `/admin/**`, `/operador/**` y `/gestor/**` exigen la identidad del
      usuario con el rol TURISTA, PRESTADOR, ADMINISTRADOR, OPERADOR_DISPONIBILIDAD o GESTOR_DESTINO,
      respectivamente (DN-04, DN-05). Sin identidad responden 401 `NO_AUTENTICADO`; con otro rol, 403
      `ACCESO_DENEGADO`. Las demás rutas son públicas, salvo `/internal/**`, que Nginx no expone.
servers:
  - url: http://localhost:8080/api/nucleo
    description: Piloto con Docker Compose, detrás de Nginx
tags:
  - name: Cuentas
    description: Módulo 1 (RF-01 a RF-13).
  - name: Solicitudes
    description: Módulo 4 (RF-30 a RF-45).
  - name: Pagos
    description: Módulo 5 (RF-46 a RF-58).
  - name: Prestadores
    description: Módulo 7 (RF-62, RF-63, RF-68 a RF-71, RF-73 a RF-75).
  - name: Administración
    description: Módulo 8 (RF-76 a RF-83).
  - name: Indicadores
    description: Módulo 9 (RF-85 a RF-89).

paths:
  /admin/moderacion/ofertas/{ofertaId}/decision:
    post:
      tags: [Administración]
      operationId: moderarOferta
      summary: Aprobar o rechazar la versión en moderación de una oferta (RF-79)
      description: |
        El administrador lee la cola en el catálogo (`GET /api/catalogo/admin/moderacion/ofertas`) y decide aquí
        (DN-08). El núcleo verifica con el catálogo que esa versión siga en moderación, guarda la decisión y envía
        al catálogo el aviso de moderación por la bandeja de salida, que la aplica en los siguientes segundos. Un
        rechazo se notifica al prestador con su motivo.

        Repetir la misma decisión sobre la misma versión responde 200 con la decisión de entonces, aunque el catálogo
        ya la haya aplicado; tomar la contraria responde 409 `MODERACION_YA_DECIDIDA`.
      parameters:
        - name: ofertaId
          in: path
          required: true
          schema:
            type: string
          example: b00000000000000000000017
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionOfertaRequest'
            example:
              numeroVersion: 1
              decision: RECHAZAR
              motivo: Falta el punto de encuentro
      responses:
        '200':
          description: La decisión guardada, o la que ya se había tomado igual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionModeracion'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEstaEnModeracion'
        '409':
          $ref: '#/components/responses/ConflictoModeracion'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'

  /admin/moderacion/opiniones/{opinionId}/decision:
    post:
      tags: [Administración]
      operationId: moderarOpinion
      summary: Aprobar o rechazar una opinión en moderación (RF-80)
      description: |
        Como las ofertas, sin número de versión: una opinión no se edita (DC-42 del catálogo). Un rechazo se notifica
        al turista con su motivo (DN-08).
      parameters:
        - name: opinionId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionOpinionRequest'
      responses:
        '200':
          description: La decisión guardada, o la que ya se había tomado igual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionModeracion'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEstaEnModeracion'
        '409':
          $ref: '#/components/responses/ConflictoModeracion'
        '503':
          $ref: '#/components/responses/CatalogoNoDisponible'

components:
  parameters:
    UsuarioId:
      name: X-Usuario-Id
      in: header
      required: true
      description: |
        PROVISIONAL (DN-05): sustituye al identificador del usuario que traerá el JWT. Solo se acepta con el perfil
        `demo`; sin él, la petición responde 401.
      schema:
        type: string
        format: uuid
    Rol:
      name: X-Rol
      in: header
      required: true
      description: |
        PROVISIONAL (DN-05), igual que `X-Usuario-Id`. Debe ser el rol que exige el prefijo de la ruta; con otro
        rol, la petición responde 403 `ACCESO_DENEGADO`.
      schema:
        $ref: '#/components/schemas/Rol'
    TipoPrestador:
      name: X-Tipo-Prestador
      in: header
      required: true
      description: PROVISIONAL (DN-05), igual que `X-Usuario-Id`. Obligatorio con el rol PRESTADOR.
      schema:
        $ref: '#/components/schemas/TipoPrestador'

  responses:
    DatoInvalido:
      description: Un dato no cumple las reglas; `detail` empieza por el campo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: "motivo: es obligatorio al rechazar"
            codigo: DATO_INVALIDO
    NoEstaEnModeracion:
      description: Según el catálogo, la oferta o la opinión no existe o no tiene nada en moderación.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: La oferta b00000000000000000000099 no tiene nada en moderación
            codigo: NO_ESTA_EN_MODERACION
    ConflictoModeracion:
      description: |
        `MODERACION_YA_DECIDIDA`: ya se tomó la decisión contraria sobre esa versión u opinión.
        `VERSION_NO_VIGENTE`: la versión en moderación es otra, porque el prestador editó la oferta; hay que volver a
        cargar la cola.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: "La versión 1 de la oferta b00000000000000000000017 ya se decidió: APROBAR"
            codigo: MODERACION_YA_DECIDIDA
    CatalogoNoDisponible:
      description: El catálogo no respondió a tiempo al verificar; no se decide sin verificar. Se puede reintentar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Service Unavailable
            status: 503
            detail: "El catálogo no está disponible: no respondió a tiempo"
            codigo: CATALOGO_NO_DISPONIBLE
    NoAutenticado:
      description: Falta la identidad del usuario, o está mal formada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: No autenticado
            status: 401
            detail: Falta el header X-Usuario-Id
            codigo: NO_AUTENTICADO
    AccesoDenegado:
      description: El rol del usuario no es el que exige la ruta.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Acceso denegado
            status: 403
            detail: Esta ruta es solo para el rol TURISTA
            codigo: ACCESO_DENEGADO
    Conflicto:
      description: Otra operación modificó el mismo dato al mismo tiempo y los reintentos no alcanzaron (ADR-05).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Conflicto de concurrencia
            status: 409
            detail: Otra operación modificó el mismo dato al mismo tiempo; vuelve a intentarlo
            codigo: CONFLICTO_CONCURRENCIA

  schemas:
    Decision:
      type: string
      enum: [APROBAR, RECHAZAR]
    DecisionOfertaRequest:
      type: object
      required: [numeroVersion, decision]
      properties:
        numeroVersion:
          type: integer
          minimum: 1
          description: La versión que el administrador revisó en la cola del catálogo.
        decision:
          $ref: '#/components/schemas/Decision'
        motivo:
          type: string
          maxLength: 1000
          description: Obligatorio al rechazar; se notifica al prestador.
    DecisionOpinionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        motivo:
          type: string
          maxLength: 1000
          description: Obligatorio al rechazar; se notifica al turista.
    DecisionModeracion:
      type: object
      required: [tipo, moderadoId, decision, administradorId, decididaEn]
      properties:
        tipo:
          type: string
          enum: [OFERTA, OPINION]
        moderadoId:
          type: string
          description: El identificador de la oferta o de la opinión en el catálogo.
        numeroVersion:
          type: integer
          description: Solo para una oferta.
        decision:
          $ref: '#/components/schemas/Decision'
        motivo:
          type: string
          description: Solo si se rechazó.
        administradorId:
          type: string
          format: uuid
        decididaEn:
          type: string
          format: date-time
    Rol:
      type: string
      description: Los roles del SRS (DN-04). El catálogo solo distingue los tres primeros.
      enum: [TURISTA, PRESTADOR, ADMINISTRADOR, OPERADOR_DISPONIBILIDAD, GESTOR_DESTINO]
    TipoPrestador:
      type: string
      enum: [ALOJAMIENTO, RESTAURANTE, AGENCIA_OPERADORA, GUIA_INDEPENDIENTE]
    Problema:
      type: object
      description: ProblemDetail (RFC 7807) con la propiedad `codigo`.
      required: [status, codigo]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        codigo:
          type: string
          description: Motivo estable del error. Cada módulo agrega aquí sus códigos.
          enum:
            - DATO_INVALIDO
            - NO_AUTENTICADO
            - ACCESO_DENEGADO
            - CONFLICTO_CONCURRENCIA
            - NO_ESTA_EN_MODERACION
            - VERSION_NO_VIGENTE
            - MODERACION_YA_DECIDIDA
            - CATALOGO_NO_DISPONIBLE
