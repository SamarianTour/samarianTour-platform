        fechaInicio:
          type: string
          format: date
        horaSalida:
          type: string
          description: Solo actividad y paquete.
        horaReserva:
          type: string
          description: Solo restaurante.
        fechaSalida:
          type: string
          format: date
          description: Solo alojamiento.
        numeroUnidades:
          type: integer
          description: Solo alojamiento.
        personas:
          type: integer
        nota:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoSolicitud'
        condiciones:
