  /turista/solicitudes/{solicitudId}:
    get:
      tags: [Solicitudes]
      operationId: consultarSolicitudTurista
      summary: El estado real de una solicitud, con su historial y su plazo vigente (RF-33, RF-42)
      description: |
        Es la reconsulta al reconectar del ADR-04: si una petición quedó sin respuesta, la aplicación pregunta aquí en
        lugar de suponer. Atendida, trae el precio base y las condiciones, incluida la política de cancelación (RF-42),
        y `venceEn` es el fin de la ventana para confirmar y pagar (RF-55). La de otro turista responde 404.
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
      responses:
        '200':
          description: La solicitud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudTurista'
              example:
                id: 6f1c2a9e-4b7d-4c1e-9a52-3d8e0f7b1a20
                oferta:
                  id: b00000000000000000000001
                  tipo: ACTIVIDAD
                  nombre: Caminata a Cabo San Juan del Guía
                  zonaId: a00000000000000000000005
                fechaInicio: '2026-10-28'
                horaSalida: '07:00'
                personas: 2
                nota: Vamos con una niña de 8 años
                estado: ATENDIDA
                condiciones:
                  precioBase: 300000
                  politicaCancelacion: Sin reembolso a menos de 24 horas del servicio
                  nota: Incluye el ingreso al parque
                venceEn: '2026-10-26T19:00:00Z'
                creadaEn: '2026-10-26T15:00:00Z'
                actualizadaEn: '2026-10-26T16:00:00Z'
                historial:
                  - a: PENDIENTE
                    en: '2026-10-26T15:00:00Z'
                    actor: TURISTA
                  - de: PENDIENTE
                    a: ATENDIDA
                    en: '2026-10-26T16:00:00Z'
