        tipo:
          $ref: '#/components/schemas/TipoPrestador'
        numeroEmpleados:
          type: integer
          minimum: 1
          maximum: 100000
          description: Obligatorio, salvo para el guía independiente, que no lo envía.
        modalidades:
          type: array
          description: Solo el guía independiente, al menos una (RF-69).
          items:
            type: string
            enum: [CAMINATA, BICICLETA, KAYAK, OTRA]
        idiomas:
          type: array
          description: Solo el guía independiente, al menos uno, con códigos de dos letras (RF-69).
          items:
            type: string
            pattern: '^[a-z]{2}$'
    DatosTipoRequest:
      type: object
      required: [tipo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoPrestador'
        numeroEmpleados:
          type: integer
          minimum: 1
          maximum: 100000
          description: Obligatorio, salvo para el guía independiente, que no lo envía.
        modalidades:
          type: array
          description: Solo el guía independiente, al menos una (RF-69).
          items:
            type: string
            enum: [CAMINATA, BICICLETA, KAYAK, OTRA]
        idiomas:
          type: array
          description: Solo el guía independiente, al menos uno, con códigos de dos letras (RF-69).
          items:
            type: string
            pattern: '^[a-z]{2}$'
    WhatsappPrestadorRequest:
      type: object
      required: [whatsapp]
      properties:
        whatsapp:
          type: string
          description: Con el indicativo del país, formato E.164.
    CodigoWhatsappRequest:
      type: object
      required: [codigo]
      properties:
        codigo:
          type: string
          pattern: '^[0-9]{6}$'
    CuentaCobroRequest:
      type: object
      required: [tipo, numero, titular]
      properties:
        tipo:
          type: string
          enum: [AHORROS, CORRIENTE, NEQUI, DAVIPLATA]
        entidad:
          type: string
          maxLength: 100
          description: El banco; obligatorio para AHORROS y CORRIENTE.
        numero:
          type: string
          description: De 6 a 20 dígitos, o el celular (10 dígitos que empiezan por 3) para Nequi y Daviplata.
        titular:
          type: string
          maxLength: 100
    CuentaCobro:
      type: object
      required: [tipo, entidad, numeroEnmascarado, titular, vigenteDesde]
      properties:
        tipo:
          type: string
          enum: [AHORROS, CORRIENTE, NEQUI, DAVIPLATA]
        entidad:
          type: string
        numeroEnmascarado:
          type: string
          description: Solo los últimos 4 dígitos.
        titular:
          type: string
        vigenteDesde:
          type: string
          format: date-time
    CambioRntRequest:
      type: object
      required: [numeroRnt]
      properties:
        numeroRnt:
          type: string
          pattern: '^[0-9]{1,10}$'
    Prestador:
      type: object
      description: Los datos del prestador como los ve él mismo; nunca salen en el catálogo.
      required: [id, numeroRnt, tipo, categoria, estadoRnt, habilitado]
      properties:
        id:
          type: string
          format: uuid
        numeroRnt:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoPrestador'
        numeroEmpleados:
          type: integer
        modalidades:
          type: array
          items:
            type: string
        idiomas:
          type: array
          items:
            type: string
        categoria:
          type: string
          enum: [GUIA_INDEPENDIENTE, MICRO_PEQUENO, MEDIANO, GRANDE]
          description: Por tamaño (RF-72, RF-89).
        razonSocial:
          type: string
          description: La del RNT; vacía mientras no se encuentre.
        municipio:
          type: string
        estadoRnt:
          type: string
          enum: [ACTIVO, INACTIVO, NO_ENCONTRADO, VERIFICACION_PENDIENTE]
        ultimaSincronizacion:
          type: string
          format: date-time
          description: La última vez que el RNT respondió (RF-73).
        habilitado:
          type: boolean
          description: Si puede publicar en el catálogo, con el RNT activo (RF-77).
        whatsapp:
          type: string
          description: Su canal de contacto; nunca es público (RF-71).
        whatsappVerificado:
          type: boolean
    DatosPersonalesRequest:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          maxLength: 100
        whatsapp:
          type: string
          description: Obligatorio para el turista; las demás cuentas no lo envían.
    SupresionRequest:
      type: object
      required: [contrasena]
      properties:
        contrasena:
          type: string
          format: password
    SolicitudRestablecimientoRequest:
      type: object
      required: [correo]
      properties:
        correo:
