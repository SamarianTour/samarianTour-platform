          type: integer
          format: int64
        totalPaginas:
          type: integer
    PaginaColaOperador:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/SolicitudCola'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    PaginaAvisos:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/Aviso'
        pagina:
          type: integer
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
    EstadoSolicitud:
      type: string
      description: |
        Los nueve estados del ciclo de vida (SRS 3.1.3, DN-09). Terminales: NO_DISPONIBLE, SIN_RESPUESTA, DECLINADA,
        VENCIDA y PAGADA. Si el prestador pierde el RNT activo, las no pagadas pasan a NO_DISPONIBLE (las PENDIENTE) o
        a VENCIDA (las demás), con el actor SISTEMA (RF-77, DN-36).
      enum: [PENDIENTE, ATENDIDA, NO_DISPONIBLE, SIN_RESPUESTA, CONFIRMADA, DECLINADA, PAGO_FALLIDO, PAGADA, VENCIDA]
    TipoOferta:
      type: string
      enum: [ACTIVIDAD, PAQUETE, ALOJAMIENTO, RESTAURANTE]
    TipoNotificacion:
      type: string
      description: Los mensajes del ciclo de vida (DN-13); el operador solo recibe NUEVA_SOLICITUD.
      enum:
        - SOLICITUD_RECIBIDA
        - NUEVA_SOLICITUD
        - SOLICITUD_ATENDIDA
        - SOLICITUD_NO_DISPONIBLE
        - SOLICITUD_SIN_RESPUESTA
        - SOLICITUD_CONFIRMADA
        - SOLICITUD_DECLINADA
        - SOLICITUD_VENCIDA
        - CUPO_LIBERADO
        - PAGO_FALLIDO
        - SOLICITUD_PAGADA
    Rol:
      type: string
      description: Los roles del SRS (DN-04). El catálogo solo distingue los tres primeros.
      enum: [TURISTA, PRESTADOR, ADMINISTRADOR, OPERADOR_DISPONIBILIDAD, GESTOR_DESTINO]
    TipoPrestador:
      type: string
      enum: [ALOJAMIENTO, RESTAURANTE, AGENCIA_OPERADORA, GUIA_INDEPENDIENTE]
    SesionCobro:
      type: object
      description: El intento de pago en curso y cómo abrirlo en la pasarela (RF-46 a RF-49).
      required: [intentoId, solicitudId, numero, estado, referencia, montoCentavos, moneda, creadoEn, checkout]
      properties:
        intentoId:
          type: string
          format: uuid
        solicitudId:
          type: string
          format: uuid
        numero:
          type: integer
          minimum: 1
          description: El orden del intento en la solicitud.
        estado:
          $ref: '#/components/schemas/EstadoIntento'
        referencia:
          type: string
          description: La que la pasarela devuelve en sus eventos; única por intento.
        montoCentavos:
          type: integer
          format: int64
          description: El precio base exacto en centavos de peso, sin cargos adicionales (RF-49).
        moneda:
          type: string
          enum: [COP]
        creadoEn:
          type: string
          format: date-time
        checkout:
          $ref: '#/components/schemas/Checkout'
    Checkout:
      type: object
      description: Cómo abrir el pago. El backend nunca ve datos de tarjeta ni de cuenta (RF-47).
      required: [pasarela, url]
      properties:
        pasarela:
          type: string
          enum: [SIMULADA, WOMPI]
        url:
          type: string
          description: El checkout de la pasarela (Web Checkout de Wompi, o la página de la pasarela simulada).
        llavePublica:
          type: string
          description: Solo Wompi, para el widget.
        firmaIntegridad:
          type: string
          description: Solo Wompi, para el widget. SHA-256 de la referencia, el monto, la moneda y el secreto.
        urlRedireccion:
          type: string
          description: A dónde vuelve el turista; no es prueba del pago (RF-51).
    IntentoPago:
      type: object
      required: [id, numero, estado, referencia, montoCentavos, creadoEn]
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoIntento'
        referencia:
          type: string
        montoCentavos:
          type: integer
          format: int64
        transaccionId:
          type: string
          description: El id de la transacción en la pasarela (RF-52); se omite hasta su primer evento.
        creadoEn:
          type: string
          format: date-time
        resueltoEn:
          type: string
          format: date-time
          description: Se omite mientras está en curso.
    EstadoIntento:
      type: string
      description: |
        ABANDONADO: sin resultado 30 min después de abierto [SUPUESTO] (DN-20); no cuenta como rechazo. ERROR cuenta
        como rechazo (RF-58).
      enum: [EN_CURSO, APROBADO, RECHAZADO, ERROR, ABANDONADO]
    EventoPasarela:
      type: object
      description: |
        Un evento de Wompi (documentación oficial, "Eventos"). Se guarda tal como llega; solo `transaction.updated`
        cambia los pagos.
      required: [event, data, signature, timestamp]
      properties:
        event:
          type: string
        data:
          type: object
        environment:
          type: string
          enum: [test, prod]
        signature:
          type: object
          required: [properties, checksum]
          properties:
            properties:
              type: array
              items:
                type: string
            checksum:
              type: string
        timestamp:
          type: integer
          format: int64
        sent_at:
          type: string
    EventoRecibido:
      type: object
      required: [duplicado]
      properties:
        duplicado:
          type: boolean
          description: true si el evento ya se había recibido, o no es de una transacción; no se guardó otra vez.
    ComisionRequest:
      type: object
      required: [porcentaje]
      properties:
        porcentaje:
          type: number
          minimum: 0
          exclusiveMaximum: true
          maximum: 100
          description: Sobre el precio base, con hasta dos decimales.
    Comision:
      type: object
      required: [porcentaje, vigenteDesde, historial]
      properties:
        porcentaje:
          type: number
        vigenteDesde:
          type: string
          format: date-time
        historial:
          type: array
          items:
            $ref: '#/components/schemas/CambioComision'
    CambioComision:
      type: object
      required: [porcentaje, vigenteDesde]
      properties:
        porcentaje:
          type: number
        vigenteDesde:
          type: string
          format: date-time
        administradorId:
          type: string
          format: uuid
          description: Quién lo cambió; se omite en el inicial.
    PagoTardio:
      type: object
      required: [id, solicitudId, referencia, transaccionId, monto, registradoEn, avisado]
      properties:
        id:
          type: string
          format: uuid
        solicitudId:
          type: string
          format: uuid
        referencia:
          type: string
        transaccionId:
          type: string
        monto:
          type: integer
          format: int64
          description: En pesos.
        registradoEn:
          type: string
          format: date-time
        avisado:
          type: boolean
          description: Si ya se avisó al administrador por WhatsApp.
    SincronizacionRnt:
      type: object
      required: [revisados, retirados, restituidos, sinRespuesta, interrumpida]
      properties:
        revisados:
          type: integer
          description: Los prestadores revisados.
        retirados:
          type: integer
          description: Los que perdieron la habilitación y salieron del catálogo (RF-77).
        restituidos:
          type: integer
          description: Los que la recuperaron y volvieron al catálogo.
        sinRespuesta:
          type: integer
          description: Los que conservaron su último estado porque el RNT no respondió (QAS-03).
        interrumpida:
          type: boolean
          description: Si se detuvo porque el RNT dejó de responder.
    Problema:
      type: object
      description: ProblemDetail (RFC 7807) con la propiedad `codigo`.
      required: [status, codigo]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        codigo:
          type: string
          description: Motivo estable del error. Cada módulo agrega aquí sus códigos.
          enum:
            - DATO_INVALIDO
            - CORREO_YA_REGISTRADO
            - POLITICA_NO_VIGENTE
            - CUENTA_NO_ENCONTRADA
            - CODIGO_INCORRECTO
            - CODIGO_NO_VIGENTE
            - CREDENCIALES_INVALIDAS
            - CUENTA_BLOQUEADA
            - CUENTA_DESACTIVADA
            - SESION_INVALIDA
            - CORREO_NO_DISPONIBLE
            - CONTRASENA_INCORRECTA
            - PRESTADOR_YA_REGISTRADO
            - PRESTADOR_NO_REGISTRADO
            - RNT_YA_REGISTRADO
            - TIPO_NO_COINCIDE_CON_RNT
            - WHATSAPP_NO_CONFIGURADO
            - CUENTA_COBRO_NO_REGISTRADA
            - PRESTADOR_NO_HABILITADO
            - NO_AUTENTICADO
            - ACCESO_DENEGADO
            - CONFLICTO_CONCURRENCIA
            - NO_ESTA_EN_MODERACION
            - VERSION_NO_VIGENTE
            - MODERACION_YA_DECIDIDA
            - CATALOGO_NO_DISPONIBLE
            - OFERTA_NO_ENCONTRADA
            - SOLICITUD_NO_ENCONTRADA
            - TRANSICION_INVALIDA
            - PLAZO_VENCIDO
            - SIN_TIEMPO_PARA_CONFIRMAR
            - SOLICITUD_DUPLICADA
            - PRESTADOR_SIN_OPERADOR
            - WHATSAPP_NO_VERIFICADO
            - CLAVE_IDEMPOTENCIA_REUTILIZADA
            - SOLICITUD_NO_COBRABLE
            - INTENTOS_AGOTADOS
            - EVENTO_NO_AUTENTICO
        intentosRestantes:
          type: integer
          description: Solo con `CODIGO_INCORRECTO`.
        bloqueadaHasta:
          type: string
          format: date-time
          description: Solo con `CUENTA_BLOQUEADA`.
