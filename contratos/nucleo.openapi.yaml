          type: string
          enum: [TURISTA, PRESTADOR]
        nombre:
          type: string
          maxLength: 100
        correo:
          type: string
          format: email
          maxLength: 254
          description: Se guarda en minúsculas; es con lo que se inicia sesión.
        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Con al menos una letra y un número [SUPUESTO] (DN-28).
        whatsapp:
          type: string
          description: Obligatorio para el turista y prohibido para el prestador; con indicativo, formato E.164.
          example: '+573001234567'
        aceptaPolitica:
          type: boolean
          description: Tiene que ser true (RF-09).
        versionPolitica:
          type: string
          description: La versión que se leyó y aceptó; debe ser la vigente (RF-10).
    Cuenta:
      type: object
      description: La cuenta como la ve su titular. Nunca lleva la contraseña.
      required: [id, rol, nombre, correo]
      properties:
        id:
          type: string
          format: uuid
        rol:
          $ref: '#/components/schemas/Rol'
        nombre:
          type: string
        correo:
          type: string
        whatsapp:
          type: string
          description: Solo el turista.
        whatsappVerificado:
