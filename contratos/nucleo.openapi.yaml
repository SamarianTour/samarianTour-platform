        contrasena:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    InicioSesionRequest:
      type: object
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          description: Sin importar mayúsculas.
        contrasena:
          type: string
          format: password
    TokenRenovacionRequest:
      type: object
      required: [tokenRenovacion]
      properties:
        tokenRenovacion:
          type: string
    Sesion:
      type: object
      required: [tokenAcceso, tipoToken, accesoExpiraEn, tokenRenovacion, renovacionExpiraEn, cuenta]
      properties:
        tokenAcceso:
          type: string
          description: "JWT RS256 para `Authorization: Bearer`; vence a los 15 minutos."
        tipoToken:
          type: string
          enum: [Bearer]
        accesoExpiraEn:
          type: string
          format: date-time
        tokenRenovacion:
          type: string
          description: Opaco; sirve una sola vez para pedir tokens nuevos.
        renovacionExpiraEn:
          type: string
          format: date-time
        cuenta:
          $ref: '#/components/schemas/Cuenta'
    RegistroRequest:
