      summary: El estado real de una solicitud, con su historial y su plazo vigente (RF-33, RF-42)
      description: |
        Es la reconsulta al reconectar del ADR-04: si una petición quedó sin respuesta, la aplicación pregunta aquí en
        lugar de suponer. Atendida, trae el precio base y las condiciones, incluida la política de cancelación (RF-42),
        y `venceEn` es el fin de la ventana para confirmar y pagar (RF-55). La de otro turista responde 404.
