  /operador/solicitudes/{solicitudId}/atencion:
    post:
      tags: [Solicitudes]
      operationId: atenderSolicitud
      summary: Marcar la solicitud Atendida, con precio y condiciones, o No disponible (RF-37 a RF-40)
      description: |
        - **ATENDIDA:** exige `precioBase` (el total en pesos, sin cargos adicionales, RF-37), `politicaCancelacion`
          y `aparteAcordado: true` (el prestador aceptó apartar el cupo durante la ventana, RF-38, RF-39). Abre la
          ventana de confirmación y pago: 3 h, o hasta las 08:00 siguientes si se atiende entre las 19:00 y las 04:59
          (RF-55). Si esa ventana, con la gracia de 30 min, terminaría después del inicio del servicio, responde 409
          `SIN_TIEMPO_PARA_CONFIRMAR`: solo puede marcarse No disponible (RF-39).
        - **NO_DISPONIBLE:** `nota` opcional como motivo, sin el detalle de la negociación (RF-40).

        Pasadas las 24 h no se puede atender (409 `PLAZO_VENCIDO`). Si el vencimiento corrió a la vez, gana uno y el
        otro ve el estado real: 409 `TRANSICION_INVALIDA` (ADR-05). Una vez atendida, sus datos no cambian.
      parameters:
        - $ref: '#/components/parameters/SolicitudId'
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtencionRequest'
            examples:
              atendida:
                summary: Hay cupo
                value:
                  resultado: ATENDIDA
                  precioBase: 300000
                  politicaCancelacion: Sin reembolso a menos de 24 horas del servicio
                  aparteAcordado: true
                  nota: Incluye el ingreso al parque
              noDisponible:
                summary: No hay cupo
                value:
                  resultado: NO_DISPONIBLE
                  nota: Sin cupo esa semana
      responses:
        '200':
          description: La solicitud con su nuevo estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudOperador'
              example:
                id: 6f1c2a9e-4b7d-4c1e-9a52-3d8e0f7b1a20
                oferta:
                  id: b00000000000000000000001
                  tipo: ACTIVIDAD
                  nombre: Caminata a Cabo San Juan del Guía
                  zonaId: a00000000000000000000005
                prestadorId: 10000000-0000-0000-0000-000000000001
                whatsappPrestador: '+573001110101'
                fechaInicio: '2026-10-28'
                horaSalida: '07:00'
                personas: 2
                estado: ATENDIDA
                condiciones:
                  precioBase: 300000
                  politicaCancelacion: Sin reembolso a menos de 24 horas del servicio
                  nota: Incluye el ingreso al parque
                venceEn: '2026-10-26T19:00:00Z'
                proximaAVencer: false
                creadaEn: '2026-10-26T15:00:00Z'
                actualizadaEn: '2026-10-26T16:00:00Z'
                historial:
                  - a: PENDIENTE
                    en: '2026-10-26T15:00:00Z'
                    actor: TURISTA
                  - de: PENDIENTE
                    a: ATENDIDA
                    en: '2026-10-26T16:00:00Z'
                    actor: OPERADOR
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/SolicitudNoEncontrada'
        '409':
          $ref: '#/components/responses/ConflictoSolicitud'

