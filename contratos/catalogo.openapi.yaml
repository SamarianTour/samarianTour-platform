openapi: 3.0.3
info:
  title: Samarian Tour · Catálogo
  version: 0.1.0
  description: |
    API del servicio de catálogo. Este contrato cubre los endpoints del prototipo: búsqueda y ficha de ofertas,
    zonas, las ofertas del prestador (publicar, editar, retirar y listar las propias), las opiniones de los
    turistas, la moderación, los avisos internos del núcleo y las consultas internas del núcleo y de la
    recomendación.

    - Las rutas no incluyen el prefijo `/api/catalogo`: es el context-path del servicio y va en `servers`.
    - Los errores salen como `application/problem+json` (RFC 7807) con la propiedad `codigo`.
    - Las rutas `/prestador/**`, `/admin/**` y `/turista/**` exigen la identidad del usuario con el rol PRESTADOR,
      ADMINISTRADOR o TURISTA, respectivamente (DC-13). Sin identidad responden 401 `NO_AUTENTICADO`; con otro rol,
      403 `ACCESO_DENEGADO`. Las demás rutas son públicas.
servers:
  - url: http://localhost:8080/api/catalogo
    description: Piloto con Docker Compose, detrás de Nginx
tags:
  - name: Catálogo público
    description: Búsqueda y consulta; no exige identidad.
  - name: Prestador
    description: Ofertas del prestador. Exige la identidad con el rol PRESTADOR.
  - name: Turista
    description: Opiniones del turista. Exige la identidad con el rol TURISTA.
  - name: Administrador
    description: Moderación. Exige la identidad con el rol ADMINISTRADOR.
  - name: Interno
    description: |
      Avisos del núcleo y consultas del núcleo y de la recomendación. Nginx no expone estas rutas hacia afuera.

paths:
  /ofertas:
    get:
      tags: [Catálogo público]
      operationId: buscarOfertas
      summary: Buscar ofertas visibles por texto y filtros (RF-14 a RF-17)
      description: |
        Devuelve solo ofertas visibles: con versión publicada, no retiradas y de un prestador con el RNT activo.
        Un paquete además exige que todas sus actividades sean visibles (RF-22). Todos los filtros son opcionales.
        El orden es por precio de referencia y luego por id, para que la paginación sea estable.
      parameters:
        - name: texto
          in: query
          description: |
            Texto libre (DC-37). Cada palabra debe aparecer en el nombre o en la descripción de la versión publicada,
            aunque sea incompleta ("buce" encuentra "buceo"), sin distinguir mayúsculas ni tildes. En un paquete se
            buscan su nombre y su descripción, no los de sus actividades. Se ignoran los espacios de los extremos.
          schema:
            type: string
            minLength: 2
            maxLength: 100
          example: cafe minca
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/TipoOferta'
        - name: zonaId
          in: query
          schema:
            type: string
          example: a00000000000000000000005
        - name: precioMin
          in: query
          schema:
            type: number
            minimum: 0
        - name: precioMax
          in: query
          schema:
            type: number
            minimum: 0
        - name: tipoActividad
          in: query
          description: Actividades de ese tipo y paquetes que incluyen al menos una (DC-24).
          schema:
            $ref: '#/components/schemas/TipoActividad'
        - name: nivelEsfuerzoMaximo
          in: query
          description: |
            Actividades y paquetes con ese nivel de esfuerzo o uno menor (DC-25). El de un paquete es el mayor
            de sus actividades. Los alojamientos y los restaurantes no tienen nivel y quedan fuera.
          schema:
            $ref: '#/components/schemas/NivelEsfuerzo'
        - name: accesibleSillaRuedas
          in: query
          description: Con `true`, solo ofertas accesibles en silla de ruedas (RF-17).
          schema:
            type: boolean
            default: false
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de resultados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaOfertas'
        '400':
          $ref: '#/components/responses/DatoInvalido'

  /ofertas/{id}:
    get:
      tags: [Catálogo público]
      operationId: consultarFichaOferta
      summary: Ficha de una oferta (RF-20, RF-24, RF-25)
      parameters:
        - $ref: '#/components/parameters/OfertaId'
      responses:
        '200':
          description: Ficha de la oferta, con su zona y el perfil público del prestador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaOferta'
        '404':
          $ref: '#/components/responses/OfertaNoEncontrada'

  /zonas:
    get:
      tags: [Catálogo público]
      operationId: consultarZonas
      summary: Zonas activas, ordenadas por nombre (RF-14, RF-25)
      responses:
        '200':
          description: Zonas activas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Zona'

  /fotos/{fotoId}/{tamano}:
    get:
      tags: [Catálogo público]
      operationId: consultarFoto
      summary: Una foto en un tamaño (DC-39)
      description: |
        Siempre es un JPG generado por el catálogo, sin los metadatos del archivo original. Una foto nunca cambia,
        así que se puede guardar en caché un año (`Cache-Control: public, max-age=31536000, immutable`).
      parameters:
        - name: fotoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tamano
          in: path
          required: true
          schema:
            type: string
            enum: [galeria, miniatura]
      responses:
        '200':
          description: La foto.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/FotoNoEncontrada'

  /prestador/perfil:
    get:
      tags: [Prestador]
      operationId: consultarPerfilPropio
      summary: El perfil público del prestador (RF-64)
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
        - $ref: '#/components/parameters/TipoPrestador'
      responses:
        '200':
          description: El perfil, tal como lo ve el turista.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilPublico'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/PerfilNoEncontrado'
    put:
      tags: [Prestador]
      operationId: guardarPerfilPropio
      summary: Crear o actualizar el perfil público (RF-64, RF-72)
      description: |
        Crea el perfil la primera vez y después reemplaza sus datos; las fotos que ya tiene se conservan. Se publica
        de inmediato, sin moderación (DC-39). Solo la descripción es obligatoria (DC-26).
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
        - $ref: '#/components/parameters/TipoPrestador'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PerfilRequest'
      responses:
        '200':
          description: El perfil guardado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilPublico'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '409':
          $ref: '#/components/responses/ConflictoConcurrencia'

  /prestador/perfil/fotos:
    post:
      tags: [Prestador]
      operationId: agregarFotoPerfil
      summary: Subir una foto al perfil (RF-64, RF-72)
      description: |
        JPG, PNG o WebP de hasta 5 MB; el perfil tiene como máximo 6 fotos. El formato se reconoce por el contenido
        del archivo. El catálogo guarda una versión nueva de la foto, enderezada y sin metadatos (por ejemplo, sin la
        ubicación GPS), en dos tamaños (DC-39). Hay que crear el perfil antes de subir fotos.
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
        - $ref: '#/components/parameters/TipoPrestador'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto:
                  type: string
                  format: binary
      responses:
        '201':
          description: El perfil con la foto nueva al final.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilPublico'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/PerfilNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoConcurrencia'

  /prestador/perfil/fotos/{fotoId}:
    delete:
      tags: [Prestador]
      operationId: quitarFotoPerfil
      summary: Quitar una foto del perfil (RF-64)
      description: |
        La quita del perfil y la borra del almacenamiento. Si el perfil no tiene esa foto no hace nada: quitarla dos
        veces no es un error.
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
        - $ref: '#/components/parameters/TipoPrestador'
        - name: fotoId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: La foto ya no está en el perfil.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/PerfilNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoConcurrencia'

  /prestador/ofertas:
    get:
      tags: [Prestador]
      operationId: listarOfertasPropias
      summary: Listar las ofertas del prestador (RF-65)
      description: |
        Devuelve las ofertas del prestador de la identidad en cualquier estado, incluidas las retiradas y las que
        aún no tienen versión publicada, ordenadas por id.
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
        - $ref: '#/components/parameters/TipoPrestador'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de ofertas del prestador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaOfertasPrestador'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
    post:
      tags: [Prestador]
      operationId: publicarOferta
      summary: Publicar una oferta (RF-65, RF-67)
      description: |
        La oferta nace con su versión 1 en moderación y no es visible hasta que el núcleo avise su aprobación.
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
        - $ref: '#/components/parameters/TipoPrestador'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaRequest'
            example:
              tipo: ACTIVIDAD
              nombre: Caminata a la cascada de Marinka
              descripcion: Sendero de montaña con baño en la cascada
              precioReferencia: 70000
              zonaId: a00000000000000000000007
              capacidadMaxima: 8
              tipoActividad: SENDERISMO
              nivelEsfuerzo: MODERADO
              horariosSalida: ['08:00']
              puntoEncuentro: Plaza principal de Minca
              duracionMinutos: 180
              modalidad: CAMINATA
              idiomasAtencion: [es]
      responses:
        '201':
          description: Oferta creada, con su versión pendiente en moderación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaPrestador'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'

  /prestador/ofertas/{id}:
    put:
      tags: [Prestador]
      operationId: editarOferta
      summary: Editar una oferta (RF-66)
      description: |
        Crea una versión pendiente con número nuevo, que reemplaza a la pendiente anterior. La versión publicada
        sigue visible hasta que se apruebe la nueva. El cuerpo trae el contenido completo y el tipo no puede cambiar.
      parameters:
        - $ref: '#/components/parameters/OfertaId'
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
        - $ref: '#/components/parameters/TipoPrestador'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfertaRequest'
      responses:
        '200':
          description: Oferta con su nueva versión pendiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaPrestador'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/OfertaNoEncontrada'
        '409':
          $ref: '#/components/responses/Conflicto'

  /prestador/ofertas/{id}/retiro:
    patch:
      tags: [Prestador]
      operationId: retirarOferta
      summary: Retirar una oferta (RF-65)
      description: |
        Marca la oferta como retirada; no la borra, porque las solicitudes en curso siguen apuntando a ella.
        El retiro es definitivo (DC-09): la oferta deja de ser visible y ya no se puede editar. Se permite aunque
        el RNT del prestador esté inactivo, porque no publica nada. Retirar una oferta ya retirada no cambia nada
        y también responde 204. No lleva cuerpo.
      parameters:
        - $ref: '#/components/parameters/OfertaId'
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
        - $ref: '#/components/parameters/TipoPrestador'
      responses:
        '204':
          description: Oferta retirada.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/PrestadorNoAutorizado'
        '404':
          $ref: '#/components/responses/OfertaNoEncontrada'
        '409':
          $ref: '#/components/responses/ConflictoConcurrencia'

  /admin/moderacion/ofertas:
    get:
      tags: [Administrador]
      operationId: listarOfertasEnModeracion
      summary: Ofertas que esperan la decisión del administrador (RF-79)
      description: |
        Ofertas no retiradas cuya versión pendiente está en moderación, nuevas o ediciones, de la enviada hace más
        tiempo a la más reciente (DC-38). Las rechazadas no aparecen: esperan a que el prestador edite (DC-06).
        El administrador decide en el núcleo, que envía la decisión al catálogo como aviso de moderación.
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de ofertas en moderación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaOfertasPendientes'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

  /internal/avisos:
    post:
      tags: [Interno]
      operationId: recibirAviso
      summary: Aviso del núcleo, de moderación o de habilitación RNT (RF-77, RF-79)
      description: |
        Es idempotente (DC-04): cada aviso trae un `idAviso` y un aviso repetido no se vuelve a aplicar.
        Los tres resultados responden 200, para que el núcleo no reintente el aviso.
        Si otra escritura se cruza y los reintentos del servidor no alcanzan, responde 409 sin marcar el aviso como
        procesado, y el núcleo lo reenvía (ADR-05).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Aviso'
            examples:
              aprobar:
                summary: Aprobar la versión 1 de una oferta
                value:
                  idAviso: aviso-0001
                  tipo: MODERACION
                  ofertaId: b00000000000000000000001
                  numeroVersion: 1
                  decision: APROBAR
              rechazar:
                summary: Rechazar la versión 2 de una oferta
                value:
                  idAviso: aviso-0002
                  tipo: MODERACION
                  ofertaId: b00000000000000000000001
                  numeroVersion: 2
                  decision: RECHAZAR
                  motivo: El precio no coincide con la descripción
              inhabilitar:
                summary: El prestador perdió el RNT
                value:
                  idAviso: aviso-0003
                  tipo: HABILITACION
                  prestadorId: 10000000-0000-0000-0000-000000000001
                  rntActivo: false
                  version: 2
      responses:
        '200':
          description: Aviso recibido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvisoResultado'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '409':
          $ref: '#/components/responses/ConflictoConcurrencia'

  /internal/ofertas:
    get:
      tags: [Interno]
      operationId: consultarOfertasVisibles
      summary: Ofertas visibles para la recomendación (RF-26, RF-29, RET-02)
      description: |
        Base de conocimiento cerrada de la recomendación (DC-36). Aplica la misma visibilidad, el mismo orden (por
        precio de referencia y luego por id) y la misma paginación que la búsqueda pública: el catálogo no prioriza
        a ningún prestador, y la rotación entre ofertas de igual afinidad le corresponde a la recomendación.
        No incluye calificaciones, comisión ni tamaño del prestador.
      parameters:
        - name: tipo
          in: query
          schema:
            $ref: '#/components/schemas/TipoOferta'
        - name: zonaId
          in: query
          schema:
            type: string
          example: a00000000000000000000005
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de ofertas visibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaOfertasVisibles'
        '400':
          $ref: '#/components/responses/DatoInvalido'

  /internal/ofertas/{id}:
    get:
      tags: [Interno]
      operationId: consultarOfertaInterna
      summary: Oferta que el turista pide en una solicitud (RF-30)
      description: |
        El núcleo la consulta al crear la solicitud, con corte de circuito de 3 s (ADR-04), y copia el nombre, el
        tipo, la zona y el prestador (DC-35). Solo se puede pedir una oferta visible: con la misma regla que la ficha,
        una retirada, sin versión aprobada, de un prestador con el RNT inactivo o un paquete con alguna actividad no
        visible responden 404. El precio no va: lo registra el operador al atender la solicitud (RF-37).
      parameters:
        - $ref: '#/components/parameters/OfertaId'
      responses:
        '200':
          description: La oferta, según su versión publicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaInterna'
        '404':
          $ref: '#/components/responses/OfertaNoEncontrada'

  /internal/moderacion/ofertas/{id}:
    get:
      tags: [Interno]
      operationId: consultarOfertaEnModeracion
      summary: Oferta en moderación que el núcleo va a aprobar o rechazar (RF-79)
      description: |
        El núcleo la consulta antes de decidir (DC-38): con el prestador aplica sus reglas de aprobación y notifica
        el rechazo, y con el número de versión arma el aviso de moderación (DC-05). Si la oferta no existe, está
        retirada o no tiene una versión en moderación, responde 404.
      parameters:
        - $ref: '#/components/parameters/OfertaId'
      responses:
        '200':
          description: La oferta y su versión en moderación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfertaEnModeracion'
        '404':
          $ref: '#/components/responses/OfertaNoEncontrada'

  # Opiniones (módulo opiniones, RF-59 a RF-61 y RF-80)

  /ofertas/{id}/opiniones:
    get:
      tags: [Catálogo público]
      operationId: leerOpinionesOferta
      summary: Opiniones aprobadas de una oferta, con su resumen (RF-59)
      description: |
        Solo las aprobadas, de la más reciente a la más antigua y luego por id (DC-43). El resumen cuenta todas las
        aprobadas y da el promedio de su calificación con un decimal. No se muestra quién escribió cada opinión.
        Va aparte de la ficha porque el catálogo no depende del módulo de opiniones (DC-40). Si la oferta no es
        visible, responde 404 igual que la ficha.
      parameters:
        - $ref: '#/components/parameters/OfertaId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Resumen y página de opiniones aprobadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpinionesOferta'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '404':
          $ref: '#/components/responses/OfertaNoEncontrada'

  /turista/opiniones:
    post:
      tags: [Turista]
      operationId: publicarOpinion
      summary: Dejar una opinión sobre una oferta pagada (RF-60, RF-61)
      description: |
        Exige que el núcleo haya avisado que el turista tiene una solicitud pagada de la oferta (DC-41) y que la
        oferta exista. Solo se admite una opinión por turista y oferta. La opinión queda en moderación: se publica
        cuando el administrador la aprueba.
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpinionRequest'
            example:
              ofertaId: b00000000000000000000002
              calificacion: 5
              comentario: El arrecife estaba en buen estado y el guía explicó cómo cuidarlo.
      responses:
        '201':
          description: Opinión enviada a moderación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MiOpinion'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/OpinionNoHabilitada'
        '404':
          $ref: '#/components/responses/OfertaNoEncontrada'
        '409':
          $ref: '#/components/responses/OpinionDuplicada'
    get:
      tags: [Turista]
      operationId: listarMisOpiniones
      summary: Opiniones propias en cualquier estado
      description: |
        De la más reciente a la más antigua, con el nombre de la oferta y, si fue rechazada, el motivo (DC-42).
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de opiniones del turista.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaMisOpiniones'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

  /admin/moderacion/opiniones:
    get:
      tags: [Administrador]
      operationId: listarOpinionesEnModeracion
      summary: Opiniones que esperan la decisión del administrador (RF-80)
      description: |
        De la enviada hace más tiempo a la más reciente y luego por id, con el nombre de la oferta (DC-44). Como con
        las ofertas (DC-38), el administrador decide en el núcleo, que envía la decisión como aviso.
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
        - $ref: '#/components/parameters/Rol'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Página de opiniones en moderación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaOpinionesPendientes'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'

  /internal/moderacion/opiniones/{id}:
    get:
      tags: [Interno]
      operationId: consultarOpinionEnModeracion
      summary: Opinión en moderación que el núcleo va a aprobar o rechazar (RF-80)
      description: |
        El núcleo la consulta antes de decidir, para saber a qué turista notificar (DC-44). Si la opinión no existe
        o ya no está en moderación, responde 404.
      parameters:
        - $ref: '#/components/parameters/OpinionId'
      responses:
        '200':
          description: La opinión en moderación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpinionEnModeracion'
        '404':
          $ref: '#/components/responses/OpinionNoEncontrada'

  /internal/opiniones/avisos:
    post:
      tags: [Interno]
      operationId: recibirAvisoOpinion
      summary: Aviso del núcleo sobre opiniones (RF-60, RF-80, Ley 1581)
      description: |
        Llegan por la misma bandeja de salida que los avisos de ofertas y con las mismas reglas (DC-04): cada aviso
        trae un `idAviso`, un aviso repetido no se vuelve a aplicar y los tres resultados responden 200. El registro
        de avisos procesados es propio del módulo (DC-46).
        - `HABILITACION_OPINION`: una solicitud del turista quedó pagada y puede opinar sobre su oferta (DC-41).
        - `MODERACION_OPINION`: decisión del administrador; una opinión que ya se moderó o no existe lo ignora (DC-44).
        - `SUPRESION_TURISTA`: el núcleo ejecutó la supresión de los datos del turista; se borran sus opiniones y
          sus habilitaciones (DC-45).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvisoOpinion'
            examples:
              habilitar:
                summary: La solicitud del turista quedó pagada
                value:
                  idAviso: aviso-0101
                  tipo: HABILITACION_OPINION
                  turistaId: 80000000-0000-0000-0000-000000000008
                  ofertaId: b00000000000000000000006
              aprobar:
                summary: Aprobar una opinión
                value:
                  idAviso: aviso-0102
                  tipo: MODERACION_OPINION
                  opinionId: d0000000000000000000000b
                  decision: APROBAR
              suprimir:
                summary: Supresión de los datos de un turista
                value:
                  idAviso: aviso-0103
                  tipo: SUPRESION_TURISTA
                  turistaId: 80000000-0000-0000-0000-000000000008
      responses:
        '200':
          description: Aviso recibido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvisoResultado'
        '400':
          $ref: '#/components/responses/DatoInvalido'
        '409':
          $ref: '#/components/responses/ConflictoConcurrencia'

components:
  parameters:
    OpinionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: d0000000000000000000000b
    OfertaId:
      name: id
      in: path
      required: true
      schema:
        type: string
      example: b00000000000000000000001
    UsuarioId:
      name: X-Usuario-Id
      in: header
      required: true
      description: |
        PROVISIONAL (DC-01): sustituye al identificador del usuario que traerá el JWT del núcleo.
        Solo se acepta con el perfil `demo`; sin él, la petición responde 401.
      schema:
        type: string
        format: uuid
    Rol:
      name: X-Rol
      in: header
      required: true
      description: |
        PROVISIONAL (DC-01), igual que `X-Usuario-Id`. Debe ser el rol que exige el prefijo de la ruta: en
        `/prestador/**`, PRESTADOR; con otro rol, la petición responde 403 `ACCESO_DENEGADO`.
      schema:
        type: string
        enum: [TURISTA, PRESTADOR, ADMINISTRADOR]
    TipoPrestador:
      name: X-Tipo-Prestador
      in: header
      required: true
      description: |
        PROVISIONAL (DC-01), igual que `X-Usuario-Id`. Obligatorio con el rol PRESTADOR. Decide qué tipos de oferta
        puede publicar (DC-10).
      schema:
        $ref: '#/components/schemas/TipoPrestador'
    Page:
      name: page
      in: query
      description: Página pedida; la primera es la 0 (DC-14).
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    DatoInvalido:
      description: Un dato no cumple las reglas, o la zona no existe o está inactiva.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: 'precioMin: no puede ser mayor que precioMax'
            instance: /api/catalogo/ofertas
            codigo: DATO_INVALIDO
    NoAutenticado:
      description: Falta la identidad del usuario, o está mal formada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: No autenticado
            status: 401
            detail: Falta el header X-Usuario-Id
            instance: /api/catalogo/prestador/ofertas
            codigo: NO_AUTENTICADO
    Prohibido:
      description: |
        El usuario no puede hacer la operación; `codigo` dice por qué: `ACCESO_DENEGADO` si su rol no es el que exige
        la ruta, o una regla del prestador (`RNT_INACTIVO`, `TIPO_OFERTA_NO_PERMITIDO`, `PRESTADOR_NO_AUTORIZADO`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            rntInactivo:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                detail: El RNT del prestador 50000000-0000-0000-0000-000000000005 no está activo
                instance: /api/catalogo/prestador/ofertas
                codigo: RNT_INACTIVO
            accesoDenegado:
              value:
                type: about:blank
                title: Acceso denegado
                status: 403
                detail: Esta ruta es solo para el rol PRESTADOR
                instance: /api/catalogo/prestador/ofertas
                codigo: ACCESO_DENEGADO
    AccesoDenegado:
      description: El rol del usuario no es el que exige la ruta (`ACCESO_DENEGADO`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Acceso denegado
            status: 403
            detail: Esta ruta es solo para el rol PRESTADOR
            instance: /api/catalogo/prestador/ofertas
            codigo: ACCESO_DENEGADO
    PrestadorNoAutorizado:
      description: |
        La oferta es de otro prestador (`PRESTADOR_NO_AUTORIZADO`), o el rol del usuario no es PRESTADOR
        (`ACCESO_DENEGADO`, como en la respuesta `AccesoDenegado`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: El prestador no es el dueño de la oferta b00000000000000000000001
            instance: /api/catalogo/prestador/ofertas/b00000000000000000000001/retiro
            codigo: PRESTADOR_NO_AUTORIZADO
    OfertaNoEncontrada:
      description: La oferta no existe, o no es visible para quien la consulta.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: No existe la oferta no-existe
            instance: /api/catalogo/ofertas/no-existe
            codigo: OFERTA_NO_ENCONTRADA
    PerfilNoEncontrado:
      description: El prestador todavía no tiene perfil público; hay que crearlo antes de subir fotos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: El prestador 20000000-0000-0000-0000-000000000002 todavía no tiene perfil público
            instance: /api/catalogo/prestador/perfil
            codigo: PERFIL_NO_ENCONTRADO
    FotoNoEncontrada:
      description: No hay una foto con ese identificador, o el tamaño no existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: No existe la foto 3f2504e0-4f89-11d3-9a0c-0305e82c3301
            instance: /api/catalogo/fotos/3f2504e0-4f89-11d3-9a0c-0305e82c3301/galeria
            codigo: FOTO_NO_ENCONTRADA
    Conflicto:
      description: |
        La oferta está retirada y el retiro es definitivo (`OFERTA_NO_EDITABLE`), u otra operación la modificó al
        mismo tiempo y los reintentos del servidor no alcanzaron (`CONFLICTO_CONCURRENCIA`, ADR-05); en ese caso
        el cliente puede volver a intentarlo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            retirada:
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: La oferta b00000000000000000000001 está retirada y no se puede editar
                codigo: OFERTA_NO_EDITABLE
            concurrencia:
              value:
                type: about:blank
                title: Conflicto de concurrencia
                status: 409
                detail: Otra operación modificó el mismo dato al mismo tiempo; vuelve a intentarlo
                codigo: CONFLICTO_CONCURRENCIA
    ConflictoConcurrencia:
      description: |
        Otra operación modificó el mismo dato al mismo tiempo y los reintentos del servidor no alcanzaron (ADR-05).
        No se guardó nada y el cliente puede volver a intentarlo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Conflicto de concurrencia
            status: 409
            detail: Otra operación modificó el mismo dato al mismo tiempo; vuelve a intentarlo
            codigo: CONFLICTO_CONCURRENCIA

    OpinionNoHabilitada:
      description: |
        El turista no tiene una solicitud pagada de la oferta (`OPINION_NO_HABILITADA`, DC-41), o su rol no es
        TURISTA (`ACCESO_DENEGADO`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Forbidden
            status: 403
            detail: El turista 80000000-0000-0000-0000-000000000008 no tiene una solicitud pagada de la oferta b00000000000000000000006
            instance: /api/catalogo/turista/opiniones
            codigo: OPINION_NO_HABILITADA
    OpinionDuplicada:
      description: El turista ya opinó sobre la oferta (`OPINION_DUPLICADA`, RF-61).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: El turista 70000000-0000-0000-0000-000000000007 ya opinó sobre la oferta b00000000000000000000001
            instance: /api/catalogo/turista/opiniones
            codigo: OPINION_DUPLICADA
    OpinionNoEncontrada:
      description: La opinión no existe o ya no está en moderación (`OPINION_NO_ENCONTRADA`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: No existe la opinión d00000000000000000000001
            instance: /api/catalogo/internal/moderacion/opiniones/d00000000000000000000001
            codigo: OPINION_NO_ENCONTRADA

  schemas:
    TipoOferta:
      type: string
      enum: [ACTIVIDAD, PAQUETE, ALOJAMIENTO, RESTAURANTE]
    TipoPrestador:
      type: string
      enum: [ALOJAMIENTO, RESTAURANTE, AGENCIA_OPERADORA, GUIA_INDEPENDIENTE]
    TipoActividad:
      type: string
      description: Valores provisionales, definidos por el equipo; pueden cambiar.
      enum:
        - SENDERISMO
        - BUCEO_SNORKEL
        - DEPORTES_ACUATICOS
        - NAUTICO
        - AVISTAMIENTO_FAUNA
        - CULTURAL_HISTORICO
        - ETNOTURISMO
        - GASTRONOMICO
        - CICLISMO
        - AVENTURA
        - PLAYA_RELAX
        - OTRO
    NivelEsfuerzo:
      type: string
      description: De menor a mayor exigencia.
      enum: [BAJO, MODERADO, ALTA_EXIGENCIA]
    ModalidadRecorrido:
      type: string
      enum: [CAMINATA, BICICLETA, KAYAK, OTRA]
    EstadoModeracion:
      type: string
      enum: [EN_MODERACION, APROBADA, RECHAZADA]
    Hora:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      example: '07:30'

    Coordenada:
      type: object
      required: [latitud, longitud]
      properties:
        latitud:
          type: number
          minimum: -90
          maximum: 90
        longitud:
          type: number
          minimum: -180
          maximum: 180

    OfertaResumen:
      type: object
      description: Una oferta en los resultados de la búsqueda; el detalle está en la ficha.
      required: [id, tipo, nombre, descripcion, precioReferencia, unidadPrecio, zonaId]
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoOferta'
        nombre:
          type: string
        descripcion:
          type: string
        precioReferencia:
          type: number
          description: Precio informativo y no vinculante, en pesos colombianos.
        unidadPrecio:
          type: string
          description: Según el tipo de oferta (DC-22).
          enum: [por persona, por noche y unidad, promedio por persona]
        zonaId:
          type: string

    PaginaOfertas:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/OfertaResumen'
        pagina:
          type: integer
          description: La primera es la 0.
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
          format: int64

    FichaOferta:
      type: object
      description: |
        Según `tipo`, trae uno de los detalles `actividad`, `paquete` o `alojamiento`; el restaurante no tiene
        datos propios. Los campos sin valor no se envían.
      required: [id, tipo, nombre, descripcion, precioReferencia, unidadPrecio, capacidadMaxima, accesibleSillaRuedas]
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoOferta'
        nombre:
          type: string
        descripcion:
          type: string
        precioReferencia:
          type: number
        unidadPrecio:
          type: string
        horarios:
          type: string
          description: Texto informativo con los días o la franja de operación.
        ubicacion:
          $ref: '#/components/schemas/Coordenada'
        comoLlegar:
          type: string
        capacidadMaxima:
          type: integer
          description: Máximo de personas por solicitud.
        accesibleSillaRuedas:
          type: boolean
          description: El de un paquete es `true` solo si todas sus actividades lo son (RF-17).
        actividad:
          $ref: '#/components/schemas/DetalleActividad'
        paquete:
          $ref: '#/components/schemas/DetallePaquete'
        alojamiento:
          $ref: '#/components/schemas/DetalleAlojamiento'
        zona:
          $ref: '#/components/schemas/Zona'
        perfilPrestador:
          $ref: '#/components/schemas/PerfilPublico'

    DetalleActividad:
      type: object
      required: [tipoActividad, nivelEsfuerzo, horariosSalida]
      properties:
        tipoActividad:
          $ref: '#/components/schemas/TipoActividad'
        nivelEsfuerzo:
          $ref: '#/components/schemas/NivelEsfuerzo'
        horariosSalida:
          type: array
          items:
            $ref: '#/components/schemas/Hora'
        puntoEncuentro:
          type: string
        duracionMinutos:
          type: integer
        modalidad:
          $ref: '#/components/schemas/ModalidadRecorrido'
        idiomasAtencion:
          type: array
          items:
            type: string
            example: es

    DetallePaquete:
      type: object
      required: [actividades, tiposActividad, nivelEsfuerzo, duracionMinutos, horariosSalida]
      properties:
        actividades:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/ActividadIncluida'
        tiposActividad:
          type: array
          description: Los de sus actividades (DC-24).
          items:
            $ref: '#/components/schemas/TipoActividad'
        nivelEsfuerzo:
          description: El mayor de sus actividades (RF-17).
          allOf:
            - $ref: '#/components/schemas/NivelEsfuerzo'
        duracionMinutos:
          type: integer
        horariosSalida:
          type: array
          items:
            $ref: '#/components/schemas/Hora'

    ActividadIncluida:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: string
        nombre:
          type: string

    DetalleAlojamiento:
      type: object
      properties:
        tipoUnidad:
          type: string
          example: cabaña

    Zona:
      type: object
      required: [id, nombre, areaProtegida, altaAfluencia, buenasPracticas]
      properties:
        id:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
        ubicacion:
          $ref: '#/components/schemas/Coordenada'
        areaProtegida:
          type: boolean
          description: Área protegida o ecosistema sensible (RF-25).
        altaAfluencia:
          type: boolean
          description: Zona congestionada (RF-29).
        buenasPracticas:
          type: array
          items:
            type: string
        condicionesVisita:
          type: string

    PerfilPublico:
      type: object
      description: Perfil público del prestador (RF-24). No incluye datos de contacto directo.
      required: [descripcion, fotos, redesSociales]
      properties:
        nombreComercial:
          type: string
          description: Nombre con el que el prestador se presenta al turista. Opcional (DC-26).
          example: Mar y Selva Expediciones
        descripcion:
          type: string
        fotos:
          type: array
          description: En el orden en que el prestador las subió; como máximo 6 (DC-39).
          maxItems: 6
          items:
            $ref: '#/components/schemas/Foto'
        horariosAtencion:
          type: string
        sitioWeb:
          type: string
          format: uri
        redesSociales:
          type: array
          items:
            type: string
            format: uri

    PerfilRequest:
      type: object
      description: Los datos del perfil público que escribe el prestador (RF-64). Las fotos se suben aparte.
      required: [descripcion]
      properties:
        nombreComercial:
          type: string
          description: Opcional (DC-26).
        descripcion:
          type: string
          description: Obligatoria, sin límite de palabras.
        horariosAtencion:
          type: string
        sitioWeb:
          type: string
          format: uri
          description: URL http o https.
        redesSociales:
          type: array
          items:
            type: string
            format: uri
            description: URL http o https.

    Foto:
      type: object
      description: |
        Una foto con la dirección de cada tamaño (DC-39). Las direcciones son rutas del catálogo y nunca cambian.
      required: [id, url, urlMiniatura]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la foto; es el que se usa para quitarla.
        url:
          type: string
          description: La foto para la galería, JPG de hasta 1280 px por lado.
          example: /api/catalogo/fotos/3f2504e0-4f89-11d3-9a0c-0305e82c3301/galeria
        urlMiniatura:
          type: string
          description: La foto para las tarjetas, JPG de hasta 400 px por lado.
          example: /api/catalogo/fotos/3f2504e0-4f89-11d3-9a0c-0305e82c3301/miniatura

    OfertaRequest:
      type: object
      description: |
        Contenido completo de la oferta. `tipo` decide qué campos aplican; los que no corresponden a ese tipo
        se ignoran.

        | Tipo | Campos propios |
        |---|---|
        | ACTIVIDAD | `tipoActividad`, `nivelEsfuerzo` y `horariosSalida` (obligatorios); `puntoEncuentro`, `duracionMinutos`, `modalidad` e `idiomasAtencion` (obligatorios para el guía independiente, RF-67); `accesibleSillaRuedas` |
        | PAQUETE | `actividadIds`, `duracionMinutos` y `horariosSalida` (obligatorios) |
        | ALOJAMIENTO | `tipoUnidad`, `accesibleSillaRuedas` |
        | RESTAURANTE | `accesibleSillaRuedas` |
      required: [tipo, nombre, descripcion, precioReferencia, zonaId, capacidadMaxima]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoOferta'
        nombre:
          type: string
        descripcion:
          type: string
        precioReferencia:
          type: number
          minimum: 0
        horarios:
          type: string
        zonaId:
          type: string
          description: Debe existir y estar activa (RF-84).
        ubicacion:
          $ref: '#/components/schemas/Coordenada'
        comoLlegar:
          type: string
        capacidadMaxima:
          type: integer
          minimum: 1
        tipoActividad:
          $ref: '#/components/schemas/TipoActividad'
        nivelEsfuerzo:
          $ref: '#/components/schemas/NivelEsfuerzo'
        accesibleSillaRuedas:
          type: boolean
          default: false
        horariosSalida:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Hora'
        puntoEncuentro:
          type: string
        duracionMinutos:
          type: integer
          minimum: 1
        modalidad:
          $ref: '#/components/schemas/ModalidadRecorrido'
        idiomasAtencion:
          type: array
          items:
            type: string
            pattern: '^[a-z]{2}$'
        actividadIds:
          type: array
          description: |
            Ofertas de tipo ACTIVIDAD del mismo prestador, distintas y no retiradas (RF-22, DC-23).
            Pueden estar aún sin aprobar.
          minItems: 2
          items:
            type: string
        tipoUnidad:
          type: string

    OfertaPrestador:
      type: object
      description: La oferta como la ve su prestador.
      required: [id, tipo, retirada]
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoOferta'
        retirada:
          type: boolean
        publicada:
          $ref: '#/components/schemas/Version'
        pendiente:
          $ref: '#/components/schemas/Version'

    PaginaOfertasPrestador:
      type: object
      description: Como `PaginaOfertas`, pero con las ofertas como las ve su prestador.
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/OfertaPrestador'
        pagina:
          type: integer
          description: La primera es la 0.
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
          format: int64

    Version:
      type: object
      required: [numero, estadoModeracion, enviadaEn, nombre, precioReferencia]
      properties:
        numero:
          type: integer
          description: Número de la versión; es el que nombra el aviso de moderación (DC-05).
        estadoModeracion:
          $ref: '#/components/schemas/EstadoModeracion'
        motivoRechazo:
          type: string
        enviadaEn:
          type: string
          format: date-time
        revisadaEn:
          type: string
          format: date-time
        nombre:
          type: string
        precioReferencia:
          type: number

    Aviso:
      oneOf:
        - $ref: '#/components/schemas/AvisoModeracion'
        - $ref: '#/components/schemas/AvisoHabilitacion'
      discriminator:
        propertyName: tipo
        mapping:
          MODERACION: '#/components/schemas/AvisoModeracion'
          HABILITACION: '#/components/schemas/AvisoHabilitacion'

    AvisoModeracion:
      type: object
      description: Decisión del Administrador sobre una versión de una oferta (RF-79).
      required: [idAviso, tipo, ofertaId, numeroVersion, decision]
      properties:
        idAviso:
          type: string
        tipo:
          type: string
          enum: [MODERACION]
        ofertaId:
          type: string
        numeroVersion:
          type: integer
          minimum: 1
          description: Versión que revisó el Administrador; si ya no es la que está en moderación, el aviso se ignora.
        decision:
          type: string
          enum: [APROBAR, RECHAZAR]
        motivo:
          type: string
          description: Obligatorio al rechazar.

    AvisoHabilitacion:
      type: object
      description: Cambio en la habilitación RNT de un prestador (RF-77).
      required: [idAviso, tipo, prestadorId, rntActivo, version]
      properties:
        idAviso:
          type: string
        tipo:
          type: string
          enum: [HABILITACION]
        prestadorId:
          type: string
          format: uuid
        rntActivo:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 1
          description: Versión del prestador en el núcleo; un aviso con una versión igual o anterior se ignora (DC-02).

    AvisoResultado:
      type: object
      required: [resultado]
      properties:
        resultado:
          type: string
          description: |
            `APLICADO`: cambió el catálogo. `IGNORADO`: llegó tarde o ya no aplica. `DUPLICADO`: ya se había procesado.
          enum: [APLICADO, IGNORADO, DUPLICADO]

    OfertaInterna:
      type: object
      description: Lo que la solicitud copia de la oferta y lo que valida al crearse (RF-30, DC-35).
      required: [id, tipo, nombre, prestadorId, zonaId, capacidadMaxima]
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoOferta'
        nombre:
          type: string
        prestadorId:
          type: string
          format: uuid
        zonaId:
          type: string
        horariosSalida:
          type: array
          description: Horas entre las que el turista elige la de salida. Solo actividad y paquete.
          items:
            $ref: '#/components/schemas/Hora'
        capacidadMaxima:
          type: integer
          minimum: 1
          description: Máximo de personas por solicitud.

    OfertaVisible:
      type: object
      description: |
        Una oferta visible con los datos de los criterios explícitos de la recomendación (DC-36): tipo de oferta, tipo
        de actividad, zona, accesibilidad y precio. `prestadorId` sirve para el registro de exposición (RET-02).
      required: [id, tipo, nombre, descripcion, prestadorId, zonaId, zonaAltaAfluencia, precioReferencia,
                 unidadPrecio, tiposActividad, accesibleSillaRuedas]
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoOferta'
        nombre:
          type: string
        descripcion:
          type: string
        prestadorId:
          type: string
          format: uuid
        zonaId:
          type: string
        zonaAltaAfluencia:
          type: boolean
          description: Marca de alta afluencia de la zona (RF-29); false si la zona ya no existe.
        precioReferencia:
          type: number
          description: Precio informativo y no vinculante, en pesos colombianos.
        unidadPrecio:
          type: string
          description: Según el tipo de oferta (DC-22).
          enum: [por persona, por noche y unidad, promedio por persona]
        tiposActividad:
          type: array
          description: |
            El de una actividad, los de las actividades de un paquete (DC-24) y ninguno para alojamiento y restaurante.
          items:
            $ref: '#/components/schemas/TipoActividad'
        nivelEsfuerzo:
          $ref: '#/components/schemas/NivelEsfuerzo'
        accesibleSillaRuedas:
          type: boolean
          description: Un paquete es accesible solo si todas sus actividades lo son (RF-17).

    ContenidoVersion:
      type: object
      description: |
        El contenido de una versión tal como lo envió el prestador, con los campos de `OfertaRequest` más la unidad
        del precio. Los campos que no corresponden al tipo de la oferta se omiten.
      required: [nombre, descripcion, precioReferencia, unidadPrecio, zonaId, capacidadMaxima]
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        precioReferencia:
          type: number
        unidadPrecio:
          type: string
          enum: [por persona, por noche y unidad, promedio por persona]
        horarios:
          type: string
        zonaId:
          type: string
        ubicacion:
          $ref: '#/components/schemas/Coordenada'
        comoLlegar:
          type: string
        capacidadMaxima:
          type: integer
        tipoActividad:
          $ref: '#/components/schemas/TipoActividad'
        nivelEsfuerzo:
          $ref: '#/components/schemas/NivelEsfuerzo'
        accesibleSillaRuedas:
          type: boolean
          description: Actividad, alojamiento y restaurante; la de un paquete se calcula con sus actividades.
        horariosSalida:
          type: array
          items:
            $ref: '#/components/schemas/Hora'
        puntoEncuentro:
          type: string
        duracionMinutos:
          type: integer
        modalidad:
          $ref: '#/components/schemas/ModalidadRecorrido'
        idiomasAtencion:
          type: array
          items:
            type: string
        actividadIds:
          type: array
          items:
            type: string
        tipoUnidad:
          type: string

    OfertaPendiente:
      type: object
      description: Una oferta que espera la decisión del administrador (RF-79, DC-38).
      required: [id, tipo, prestadorId, rntPrestadorActivo, numeroVersion, enviadaEn, pendiente]
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoOferta'
        prestadorId:
          type: string
          format: uuid
        rntPrestadorActivo:
          type: boolean
          description: Copia de la habilitación del prestador; el núcleo no aprueba si no está activa.
        numeroVersion:
          type: integer
          description: Número de la versión en moderación; es el que nombra la decisión (DC-05).
        enviadaEn:
          type: string
          format: date-time
        pendiente:
          $ref: '#/components/schemas/ContenidoVersion'
        publicada:
          $ref: '#/components/schemas/ContenidoVersion'

    PaginaOfertasPendientes:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/OfertaPendiente'
        pagina:
          type: integer
          description: La primera es la 0.
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
          format: int64

    OfertaEnModeracion:
      type: object
      description: Lo que el núcleo necesita de una oferta en moderación para decidir (DC-38).
      required: [id, tipo, nombre, prestadorId, numeroVersion, enviadaEn]
      properties:
        id:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoOferta'
        nombre:
          type: string
          description: Nombre de la versión en moderación, para el mensaje al prestador.
        prestadorId:
          type: string
          format: uuid
        numeroVersion:
          type: integer
        enviadaEn:
          type: string
          format: date-time

    PaginaOfertasVisibles:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/OfertaVisible'
        pagina:
          type: integer
          description: La primera es la 0.
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
          format: int64

    EstadoOpinion:
      type: string
      enum: [EN_MODERACION, APROBADA, RECHAZADA]

    OpinionRequest:
      type: object
      description: La opinión que envía el turista (RF-60). El turista es el de la identidad, no va en el cuerpo.
      required: [ofertaId, calificacion, comentario]
      properties:
        ofertaId:
          type: string
        calificacion:
          type: integer
          minimum: 1
          maximum: 5
        comentario:
          type: string
          minLength: 10
          maxLength: 1000
          description: Sin contar los espacios de los extremos (DC-42).

    MiOpinion:
      type: object
      description: Una opinión como la ve su autor, en cualquier estado. Los campos sin valor no se envían.
      required: [id, ofertaId, calificacion, comentario, fecha, estado]
      properties:
        id:
          type: string
        ofertaId:
          type: string
        nombreOferta:
          type: string
          description: El de la oferta en el catálogo, para dar contexto.
        calificacion:
          type: integer
        comentario:
          type: string
        fecha:
          type: string
          format: date-time
          description: Cuándo el turista la envió.
        estado:
          $ref: '#/components/schemas/EstadoOpinion'
        motivoRechazo:
          type: string
          description: Solo si fue rechazada.
        revisadaEn:
          type: string
          format: date-time
          description: Solo si ya se moderó.

    PaginaMisOpiniones:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/MiOpinion'
        pagina:
          type: integer
          description: La primera es la 0.
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
          format: int64

    OpinionPublica:
      type: object
      description: Una opinión aprobada (RF-59). No dice quién la escribió (DC-43).
      required: [id, calificacion, comentario, fecha]
      properties:
        id:
          type: string
        calificacion:
          type: integer
        comentario:
          type: string
        fecha:
          type: string
          format: date-time

    ResumenOpiniones:
      type: object
      required: [totalOpiniones]
      properties:
        totalOpiniones:
          type: integer
          format: int64
          description: Opiniones aprobadas de la oferta.
        promedioCalificacion:
          type: number
          description: Con un decimal, redondeado hacia arriba desde la mitad; no se envía si no hay opiniones aprobadas.
          example: 4.7

    OpinionesOferta:
      type: object
      description: El resumen de las opiniones aprobadas de una oferta y una página de ellas (DC-14).
      required: [resumen, contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        resumen:
          $ref: '#/components/schemas/ResumenOpiniones'
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/OpinionPublica'
        pagina:
          type: integer
          description: La primera es la 0.
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
          format: int64

    OpinionPendiente:
      type: object
      description: |
        Una opinión que espera la decisión del administrador (RF-80), con el nombre de la oferta. No lleva el turista:
        el administrador no lo necesita para decidir.
      required: [id, ofertaId, calificacion, comentario, fecha]
      properties:
        id:
          type: string
        ofertaId:
          type: string
        nombreOferta:
          type: string
        calificacion:
          type: integer
        comentario:
          type: string
        fecha:
          type: string
          format: date-time

    PaginaOpinionesPendientes:
      type: object
      required: [contenido, pagina, tamano, totalElementos, totalPaginas]
      properties:
        contenido:
          type: array
          items:
            $ref: '#/components/schemas/OpinionPendiente'
        pagina:
          type: integer
          description: La primera es la 0.
        tamano:
          type: integer
        totalElementos:
          type: integer
          format: int64
        totalPaginas:
          type: integer
          format: int64

    OpinionEnModeracion:
      type: object
      description: Lo que el núcleo necesita de una opinión antes de decidir (DC-44).
      required: [id, ofertaId, turistaId, estado, fecha]
      properties:
        id:
          type: string
        ofertaId:
          type: string
        turistaId:
          type: string
          format: uuid
          description: Para notificarle la decisión.
        estado:
          $ref: '#/components/schemas/EstadoOpinion'
        fecha:
          type: string
          format: date-time

    AvisoOpinion:
      oneOf:
        - $ref: '#/components/schemas/AvisoHabilitacionOpinion'
        - $ref: '#/components/schemas/AvisoModeracionOpinion'
        - $ref: '#/components/schemas/AvisoSupresionTurista'
      discriminator:
        propertyName: tipo
        mapping:
          HABILITACION_OPINION: '#/components/schemas/AvisoHabilitacionOpinion'
          MODERACION_OPINION: '#/components/schemas/AvisoModeracionOpinion'
          SUPRESION_TURISTA: '#/components/schemas/AvisoSupresionTurista'

    AvisoHabilitacionOpinion:
      type: object
      description: |
        Una solicitud del turista quedó pagada (RF-60, DC-41). Una habilitación que ya existe, o de una oferta que
        el catálogo no tiene, se ignora.
      required: [idAviso, tipo, turistaId, ofertaId]
      properties:
        idAviso:
          type: string
        tipo:
          type: string
          enum: [HABILITACION_OPINION]
        turistaId:
          type: string
          format: uuid
        ofertaId:
          type: string

    AvisoModeracionOpinion:
      type: object
      description: Decisión del administrador sobre una opinión (RF-80, DC-44).
      required: [idAviso, tipo, opinionId, decision]
      properties:
        idAviso:
          type: string
        tipo:
          type: string
          enum: [MODERACION_OPINION]
        opinionId:
          type: string
        decision:
          type: string
          enum: [APROBAR, RECHAZAR]
        motivo:
          type: string
          description: Obligatorio al rechazar; el turista lo ve en sus opiniones.

    AvisoSupresionTurista:
      type: object
      description: |
        El núcleo ejecutó la supresión de los datos del turista (Ley 1581 de 2012): se borran sus opiniones y sus
        habilitaciones (DC-45). Si no tenía ninguna, el aviso se ignora.
      required: [idAviso, tipo, turistaId]
      properties:
        idAviso:
          type: string
        tipo:
          type: string
          enum: [SUPRESION_TURISTA]
        turistaId:
          type: string
          format: uuid

    Problema:
      type: object
      description: ProblemDetail (RFC 7807) con la propiedad `codigo`.
      required: [status, codigo]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        codigo:
          type: string
          description: Motivo estable del error (DC-15).
          enum:
            - DATO_INVALIDO
            - ZONA_NO_DISPONIBLE
            - NO_AUTENTICADO
            - ACCESO_DENEGADO
            - PRESTADOR_NO_AUTORIZADO
            - TIPO_OFERTA_NO_PERMITIDO
            - RNT_INACTIVO
            - OFERTA_NO_ENCONTRADA
            - OFERTA_NO_EDITABLE
            - CONFLICTO_CONCURRENCIA
            - OPINION_NO_HABILITADA
            - OPINION_DUPLICADA
            - OPINION_NO_ENCONTRADA
            - PERFIL_NO_ENCONTRADO
            - FOTO_NO_ENCONTRADA
