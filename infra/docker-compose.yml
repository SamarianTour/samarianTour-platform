# Piloto: todos los servicios en un solo servidor detrás de Nginx (diagrama de despliegue, figura 16).
#   docker compose -f infra/docker-compose.yml up --build
name: samarian-tour

services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_DATABASE: catalogo_db
    volumes:
      - mongo-data:/data/db
      # Los scripts de precarga solo se ejecutan cuando el volumen está vacío.
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Almacenamiento de las fotos (DC-39). Sin puertos publicados: solo el catálogo lo usa, y el navegador pide las
  # fotos al catálogo por Nginx.
  minio:
    # MinIO ya no publica imágenes en Docker Hub ni en Quay. Esta la compila Chainguard desde el código de MinIO,
    # corre sin root y se actualiza a diario; su plan gratuito solo ofrece la etiqueta latest (DC-39).
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    environment:
      # Credenciales del piloto; en un despliegue real se pasan como variables de entorno.
      MINIO_ROOT_USER: ${MINIO_USUARIO:-samarian}
      MINIO_ROOT_PASSWORD: ${MINIO_CLAVE:-samarian-fotos-piloto}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  catalogo:
    build:
      context: ..
      dockerfile: servicios/catalogo/Dockerfile
    image: samarian-tour/catalogo:latest
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/catalogo_db
      CATALOGO_MINIO_URL: http://minio:9000
      CATALOGO_MINIO_USUARIO: ${MINIO_USUARIO:-samarian}
      CATALOGO_MINIO_CLAVE: ${MINIO_CLAVE:-samarian-fotos-piloto}
      # Cuándo se borran las fotos que nadie usa (DC-47): cada hora, en el minuto 17. Para la demostración se puede
      # adelantar, por ejemplo "0 * * * * *" (cada minuto).
      CATALOGO_FOTOS_LIMPIEZA_CRON: ${FOTOS_LIMPIEZA_CRON:-0 17 * * * *}
      # mongo: los datos viven en MongoDB y las réplicas comparten el estado.
      # minio: las fotos viven en MinIO, compartido por las réplicas (DC-39).
      # demo: headers que sustituyen al token del prestador y carga de los datos de demostración
      # si las colecciones están vacías. El perfil demo es solo para la demostración.
      SPRING_PROFILES_ACTIVE: mongo,minio,demo
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/catalogo/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    # Sin puertos publicados ni container_name: solo Nginx es accesible desde fuera (QAS-02).
    deploy:
      replicas: 2
    mem_limit: 512m
    restart: unless-stopped

  # Base del núcleo transaccional (DN-03). Sin puertos publicados: solo el núcleo la usa.
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nucleo_db
      # Credenciales del piloto; en un despliegue real se pasan como variables de entorno.
      POSTGRES_USER: ${POSTGRES_USUARIO:-nucleo}
      POSTGRES_PASSWORD: ${POSTGRES_CLAVE:-nucleo-piloto}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nucleo:
    build:
      context: ..
      dockerfile: servicios/nucleo/Dockerfile
    image: samarian-tour/nucleo:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nucleo_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USUARIO:-nucleo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_CLAVE:-nucleo-piloto}
      # La bandeja de salida envía los avisos al catálogo por la red interna (DN-06).
      NUCLEO_CATALOGO_URL: http://catalogo:8080/api/catalogo
      # Clave del cifrado en reposo de los datos personales (DN-28). Sin ella el núcleo no arranca: se genera en
      # infra/.env con "bash infra/generar-claves.sh".
      NUCLEO_CIFRADO_CLAVE: "${NUCLEO_CIFRADO_CLAVE:?Falta la clave del núcleo, ejecuta bash infra/generar-claves.sh}"
      # Clave privada RSA que firma el token de acceso (DN-29); la genera el mismo script.
      NUCLEO_JWT_CLAVE_PRIVADA: "${NUCLEO_JWT_CLAVE_PRIVADA:?Falta la clave del token, ejecuta bash infra/generar-claves.sh}"
      # El correo del restablecimiento de la contraseña va a Mailpit (DN-30).
      SPRING_MAIL_HOST: mailpit
      # demo: headers que sustituyen al token mientras no exista el JWT (DN-05). Solo para la demostración.
      SPRING_PROFILES_ACTIVE: demo
      # Pagos (DN-18): la pasarela simulada por defecto; wompi con las llaves del sandbox en infra/.env, que no se
      # versiona (ver infra/.env.example). Las llaves nunca se escriben en este archivo.
      NUCLEO_PAGOS_PASARELA: ${PAGOS_PASARELA:-simulada}
      WOMPI_LLAVE_PUBLICA: ${WOMPI_LLAVE_PUBLICA:-}
      WOMPI_SECRETO_INTEGRIDAD: ${WOMPI_SECRETO_INTEGRIDAD:-}
      WOMPI_SECRETO_EVENTOS: ${WOMPI_SECRETO_EVENTOS:-}
      # RNT (DN-33): la tabla simulada de la demo por defecto; soda consulta el RNT real en datos.gov.co.
      NUCLEO_RNT_FUENTE: ${RNT_FUENTE:-simulada}
      NUCLEO_RNT_SODA_TOKEN_APLICACION: ${RNT_SODA_TOKEN_APLICACION:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/nucleo/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    # Sin puertos publicados ni container_name: solo Nginx es accesible desde fuera. Las dos réplicas aplican las
    # migraciones a la vez sin problema: Flyway las serializa con un candado de PostgreSQL (DN-01).
    deploy:
      replicas: 2
    mem_limit: 512m
    restart: unless-stopped

  # Correo del piloto (DN-30): Mailpit recibe todo lo que envía el núcleo y lo muestra en http://localhost:8025.
  # No entrega nada a direcciones reales.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    restart: unless-stopped

  # Recomendación (RF-26, RF-27): sin base de datos; lee las ofertas del catálogo y, si está configurado, consulta
  # un proveedor de IA. Si la IA falla responde por reglas; si el recomendador cae, el resto sigue (ADR-04).
  recomendacion:
    build:
      context: ..
      dockerfile: servicios/recomendacion/Dockerfile
    image: samarian-tour/recomendacion:latest
    environment:
      RECOMENDACION_CATALOGO_URL: http://catalogo:8080/api/catalogo
      # Motor con IA (QAS-06, DR-01): apagado por defecto. Se enciende en infra/.env (ver infra/.env.example), sin
      # recompilar; la key nunca se escribe en este archivo.
      RECOMENDACION_IA_HABILITADA: ${IA_HABILITADA:-false}
      RECOMENDACION_IA_API_KEY: ${GROQ_API_KEY:-}
      RECOMENDACION_IA_URL: ${IA_URL:-https://api.groq.com/openai/v1}
      RECOMENDACION_IA_MODELO: ${IA_MODELO:-openai/gpt-oss-120b}
      # Vacío para un modelo que no razona (por ejemplo, uno de Ollama).
      RECOMENDACION_IA_ESFUERZO_RAZONAMIENTO: ${IA_ESFUERZO_RAZONAMIENTO-low}
      # Alertas del destino (RF-28, DR-14): por defecto las del IDEAM, que se leen al arrancar y cada 8 horas.
      # Con ALERTAS_FUENTE=simulada en infra/.env, las del archivo de la demo. Necesita salida a internet hacia
      # visualizador.ideam.gov.co, como la de Groq.
      RECOMENDACION_ALERTAS_FUENTE: ${ALERTAS_FUENTE:-ideam}
      RECOMENDACION_ALERTAS_IDEAM_URL: ${IDEAM_ALERTAS_URL:-https://visualizador.ideam.gov.co/gisserver/rest/services/StoryMaps_IDA/Alertas_Hidrologicas/MapServer/2}
    depends_on:
      catalogo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/recomendacion/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # Una réplica, sin puertos publicados: solo Nginx es accesible desde fuera.
    deploy:
      replicas: 1
    mem_limit: 384m
    restart: unless-stopped

  # Nginx sirve el frontend ya compilado y reenvía /api/catalogo/ al catálogo, /api/nucleo/ al núcleo y
  # /api/recomendacion/ a la recomendación. No espera a la recomendación: si no está, solo esa sección falla
  # (ADR-04).
  nginx:
    build:
      context: ../frontend
    image: samarian-tour/frontend:latest
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      catalogo:
        condition: service_healthy
      nucleo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
  minio-data:
  postgres-data:
