events {}

http {
    # Tipos de contenido de los archivos del frontend; sin esto el navegador no carga el JavaScript ni el CSS.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS interno de Docker. Con el destino en una variable, Nginx vuelve a resolver el nombre
    # cada 10 s y encuentra las réplicas aunque se recreen con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        # Las rutas son las mismas que en AWS (DN-46).
        include /etc/nginx/rutas.conf;
    }
}
