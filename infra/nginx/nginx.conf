events {}

http {
    # Tipos de contenido de los archivos del frontend; sin esto el navegador no carga el JavaScript ni el CSS.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # DNS interno de Docker. Con el destino en una variable, Nginx vuelve a resolver el nombre
    # cada 10 s y encuentra las réplicas aunque se recreen con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        # Una ruta con ";" se rechaza antes de decidir a dónde va (DN-37). Nginx no quita lo que sigue al ";" al
        # comparar las rutas, pero Tomcat sí: /api/catalogo/internal;x/avisos esquivaba el bloqueo de /internal/ y
        # llegaba al catálogo como /internal/avisos. La API no usa ";" en sus rutas; en la consulta (?texto=...) sí
        # se admite, por eso solo se mira lo que va antes del "?". También "%3B", el ";" codificado.
        if ($request_uri ~* "^[^?]*(;|%3b)") {
            return 400;
        }

        # Las rutas internas (/internal/**: los avisos del núcleo y las consultas entre servicios) y la salud
        # (/actuator) de los tres servicios solo se usan dentro de la red de Docker (DN-07). Nginx compara la ruta ya
        # decodificada y normalizada, así que %69nternal, // o /x/../internal también caen aquí. Sin el "(/|$)",
        # /actuator sin barra final llegaría al servicio.
        location ~ ^/api/(catalogo|nucleo|recomendacion)/(internal|actuator)(/|$) {
            return 404;
        }

        location /api/nucleo/ {
            set $nucleo http://nucleo:8080;
            proxy_pass $nucleo;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/catalogo/ {
            # Una foto pesa como máximo 5 MB (DC-39); el catálogo responde el error si se pasa. El valor por defecto
            # de Nginx, 1 MB, rechazaría casi cualquier foto de celular antes de llegar al catálogo.
            client_max_body_size 6m;
            # Por encima de 6 MB responde Nginx, con el mismo error que daría el catálogo y no con su página HTML.
            error_page 413 = @foto_muy_grande;
            set $catalogo http://catalogo:8080;
            # Sin URI tras la variable, Nginx reenvía la ruta original (/api/catalogo/...).
            proxy_pass $catalogo;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location @foto_muy_grande {
            default_type application/problem+json;
            return 400 '{"type":"about:blank","title":"Bad Request","status":400,"detail":"foto: pesa más de 5 MB","codigo":"DATO_INVALIDO"}';
        }

        # La consulta va por POST: el texto del turista viaja en el cuerpo y no queda en el access log (DR-09).
        location /api/recomendacion/ {
            set $recomendacion http://recomendacion:8080;
            # Si el contenedor acaba de caer, Nginx puede tener todavía su IP: sin este corte esperaría 60 s para
            # conectar. Con él, el cliente recibe el 502 en segundos y sabe que la recomendación no está (ADR-04).
            proxy_connect_timeout 2s;
            proxy_pass $recomendacion;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (Angular). Una ruta de la aplicación que no es un archivo, como /ofertas/123,
        # devuelve index.html y el enrutador de Angular la resuelve en el navegador.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
