events {}

http {
    # DNS interno de Docker. Con el destino en una variable, Nginx vuelve a resolver el nombre
    # cada 10 s y encuentra las réplicas aunque se recreen con otra IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;

        # Los avisos internos (/internal/**) solo los usa el núcleo desde la red de Docker.
        location /api/catalogo/internal/ {
            return 404;
        }

        # La salud (/actuator y /actuator/**) solo la consulta el healthcheck de Docker dentro de cada contenedor.
        # La ruta exacta también se bloquea: sin ella, /actuator sin barra final llegaría al catálogo.
        location = /api/catalogo/actuator {
            return 404;
        }
        location /api/catalogo/actuator/ {
            return 404;
        }

        location /api/catalogo/ {
            set $catalogo http://catalogo:8080;
            # Sin URI tras la variable, Nginx reenvía la ruta original (/api/catalogo/...).
            proxy_pass $catalogo;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
