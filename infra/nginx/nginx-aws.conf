events {}

# Nginx en el servidor de AWS (DN-46): HTTPS con el certificado de Let's Encrypt, y HTTP solo para el desafío del
# certificado y para redirigir. Las rutas son las mismas que en local (rutas.conf).
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # No dice la versión de Nginx en los errores ni en el header Server.
    server_tokens off;

    server {
        listen 80;

        # El desafío HTTP-01 de Let's Encrypt: certbot deja aquí el archivo que la autoridad pide para comprobar que
        # el dominio apunta a este servidor, al emitir el certificado y en cada renovación.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Todo lo demás va a HTTPS: el token de acceso nunca viaja en claro (DN-37).
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        # La ruta no depende del dominio: certbot guarda el certificado con el nombre "samarian" (--cert-name), así
        # este archivo es el mismo para cualquier dominio.
        ssl_certificate /etc/letsencrypt/live/samarian/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/samarian/privkey.pem;
        # La configuración intermedia de Mozilla: TLS 1.2 y 1.3, con los cifrados por defecto de OpenSSL.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # El navegador recuerda por un año que este dominio solo se usa con HTTPS. Sin includeSubDomains ni preload:
        # otros subdominios del mismo dominio podrían no tener certificado. Las locations de rutas.conf no agregan
        # headers, así que lo heredan todas.
        add_header Strict-Transport-Security "max-age=31536000" always;

        include /etc/nginx/rutas.conf;
    }
}
