# Las rutas del piloto, las mismas en local (nginx.conf) y en AWS (nginx-aws.conf, DN-46): cada uno las incluye
# dentro de su server. NginxRutasInternasIT las prueba con la local, y NginxAwsIT, con la de AWS.

# Las cabeceras de seguridad del navegador, en todas las respuestas: el frontend, la API, las fotos y los errores
# que da Nginx ("always"). Ninguna location de aquí agrega headers, así que las heredan todas; una que agregara
# uno dejaría de heredarlas.
#   - CSP: solo se ejecuta JavaScript de este dominio, así un script inyectado no puede leer la sesión guardada en
#     el navegador. Angular y Leaflet ponen estilos en línea, por eso 'unsafe-inline' solo en style-src. Los
#     mosaicos del mapa vienen de OpenStreetMap. El build no deja scripts en línea (inlineCritical apagado en
#     angular.json): si apareciera uno, esta política lo bloquearía.
#   - frame-ancestors y X-Frame-Options: ningún sitio puede meter la plataforma en un iframe (clickjacking).
#   - nosniff: el navegador respeta el Content-Type y no "adivina" que una foto es un script.
#   - Referrer-Policy: a otros sitios solo les dice el dominio, nunca la ruta, que puede llevar un token
#     (/restablecer-contrasena?token=...).
#   - Permissions-Policy: la plataforma no usa la cámara, el micrófono ni la ubicación.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Spring Security ya manda estas dos en la API: se quitan las suyas para que no lleguen repetidas.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;

# Una ruta con ";" se rechaza antes de decidir a dónde va (DN-37). Nginx no quita lo que sigue al ";" al
# comparar las rutas, pero Tomcat sí: /api/catalogo/internal;x/avisos esquivaba el bloqueo de /internal/ y
# llegaba al catálogo como /internal/avisos. La API no usa ";" en sus rutas; en la consulta (?texto=...) sí
# se admite, por eso solo se mira lo que va antes del "?". También "%3B", el ";" codificado.
if ($request_uri ~* "^[^?]*(;|%3b)") {
    return 400;
}

# Las rutas internas (/internal/**: los avisos del núcleo y las consultas entre servicios) y la salud
# (/actuator) de los tres servicios solo se usan dentro de la red de Docker (DN-07). Nginx compara la ruta ya
# decodificada y normalizada, así que %69nternal, // o /x/../internal también caen aquí. Sin el "(/|$)",
# /actuator sin barra final llegaría al servicio.
location ~ ^/api/(catalogo|nucleo|recomendacion)/(internal|actuator)(/|$) {
    return 404;
}

# Las rutas de cuentas que se usan sin sesión: iniciar sesión, registrarse y pedir el correo de restablecimiento.
# El núcleo bloquea una cuenta tras cinco fallos (RF-05), pero eso no frena a quien prueba una contraseña contra
# muchas cuentas, ni a quien manda cientos de correos de restablecimiento. Aquí, cada IP tiene 10 peticiones por
# minuto en cada una de estas rutas, con ráfaga de 20 (la zona "cuentas" está en nginx.conf y nginx-aws.conf). La
# ráfaga es amplia porque en una feria o en la universidad muchas personas salen por la misma IP pública.
location ~ ^/api/nucleo/cuentas/(sesion|registro|contrasena/restablecimiento)$ {
    limit_req zone=cuentas burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @demasiadas_peticiones;
    set $nucleo http://nucleo:8080;
    proxy_pass $nucleo;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Sin "codigo": el frontend muestra su mensaje genérico ("vuelve a intentarlo en un momento"), que es el que sirve.
location @demasiadas_peticiones {
    default_type application/problem+json;
    return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Demasiados intentos desde esta conexión: espera un minuto y vuelve a intentarlo"}';
}

location /api/nucleo/ {
    set $nucleo http://nucleo:8080;
    proxy_pass $nucleo;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/catalogo/ {
    # Una foto pesa como máximo 5 MB (DC-39); el catálogo responde el error si se pasa. El valor por defecto
    # de Nginx, 1 MB, rechazaría casi cualquier foto de celular antes de llegar al catálogo.
    client_max_body_size 6m;
    # Por encima de 6 MB responde Nginx, con el mismo error que daría el catálogo y no con su página HTML.
    error_page 413 = @foto_muy_grande;
    set $catalogo http://catalogo:8080;
    # Sin URI tras la variable, Nginx reenvía la ruta original (/api/catalogo/...).
    proxy_pass $catalogo;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @foto_muy_grande {
    default_type application/problem+json;
    return 400 '{"type":"about:blank","title":"Bad Request","status":400,"detail":"foto: pesa más de 5 MB","codigo":"DATO_INVALIDO"}';
}

# La consulta va por POST: el texto del turista viaja en el cuerpo y no queda en el access log (DR-09).
location /api/recomendacion/ {
    set $recomendacion http://recomendacion:8080;
    # Si el contenedor acaba de caer, Nginx puede tener todavía su IP: sin este corte esperaría 60 s para
    # conectar. Con él, el cliente recibe el 502 en segundos y sabe que la recomendación no está (ADR-04).
    proxy_connect_timeout 2s;
    proxy_pass $recomendacion;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Frontend (Angular). Una ruta de la aplicación que no es un archivo, como /ofertas/123,
# devuelve index.html y el enrutador de Angular la resuelve en el navegador.
location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
}
