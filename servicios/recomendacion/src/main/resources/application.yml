spring:
  application:
    name: recomendacion
  mvc:
    # Errores en formato RFC 7807 (application/problem+json).
    problemdetails:
      enabled: true

# El token de acceso lo emite el núcleo; la recomendación lo valida con su clave pública, sin consultarlo (DR-22).
seguridad:
  jwt:
    emisor: samarian-tour-nucleo
    # X.509 en Base64; la genera infra/generar-claves.sh. Sin ella la recomendación no arranca.
    clave-publica: ${SEGURIDAD_JWT_CLAVE_PUBLICA:}

server:
  port: 8080
  servlet:
    # Nginx reenvía /api/recomendacion/** sin reescribir la ruta; el controlador se mapea sin el prefijo.
    context-path: /api/recomendacion

management:
  endpoints:
    web:
      exposure:
        # Solo la salud, para el healthcheck de Docker Compose. Nginx no deja llegar a /actuator desde fuera.
        include: health

recomendacion:
  # El token de servicio con el que lee /internal/ofertas del catálogo (DN-38, DR-23). La clave privada es solo suya y
  # llega en RECOMENDACION_JWT_CLAVE_PRIVADA; la genera infra/generar-claves.sh. Sin ella no arranca.
  jwt:
    emisor: samarian-tour-recomendacion
    clave-privada: ${RECOMENDACION_JWT_CLAVE_PRIVADA:}
  catalogo:
    # En Docker Compose se sobrescribe con RECOMENDACION_CATALOGO_URL (http://catalogo:8080/api/catalogo).
    url: http://localhost:8080/api/catalogo
    # Corte por petición al catálogo (diagrama del módulo 09).
    timeout: 3s
    # Cada cuánto se vuelve a leer el catálogo [SUPUESTO] (DR-07).
    vigencia-cache: 60s
  ia:
    # El proveedor de IA se cambia aquí, sin tocar código (QAS-06, DR-01). Apagado, o sin key, responde el motor por
    # reglas.
    habilitada: false
    # Cualquier API compatible con la de OpenAI: Groq, Ollama (http://localhost:11434/v1), Gemini u OpenAI.
    url: https://api.groq.com/openai/v1
    modelo: openai/gpt-oss-120b
    # api-key no tiene valor por defecto: llega en la variable de entorno RECOMENDACION_IA_API_KEY.
    timeout: 6s
    temperatura: 0.2
    # Tamaño de la lista corta que se envía al modelo (DR-04); corta por el límite de tokens del plan gratis (DR-11).
    candidatas: 10
    # Solo para modelos de razonamiento como gpt-oss; vacío para un modelo que no lo acepte.
    esfuerzo-razonamiento: low
  alertas:
    # simulada (por defecto: las pruebas y quien corra sin internet no dependen del IDEAM) o ideam (DR-14). En Docker
    # Compose se sobrescribe con RECOMENDACION_ALERTAS_FUENTE, que por defecto es ideam.
    fuente: simulada
    # Cada cuánto se lee la fuente: una vez al arrancar y luego cada 8 horas (DR-16). El turista solo lee la caché.
    actualizacion: PT8H
    # Si la lectura del arranque falla, se reintenta cada 2 minutos mientras no haya ninguna lectura buena (DR-16).
    reintento: PT2M
    # Las tres lecturas programadas (arranque, cada 8 horas y reintento). Solo las pruebas la ponen en false (DR-16).
    programadas: true
    ideam:
      # Capa "Alertas_vigentes" del servicio ArcGIS del IDEAM, verificada el 24-10-2026 (DR-14). Sin /query.
      url: https://visualizador.ideam.gov.co/gisserver/rest/services/StoryMaps_IDA/Alertas_Hidrologicas/MapServer/2
      # Corte por consulta de cada zona.
      timeout: 5s

resilience4j:
  circuitbreaker:
    instances:
      # Corte de circuito del proveedor de IA (QAS-03, DR-06): tras 3 fallas seguidas, 60 s directo a reglas; luego
      # una consulta de prueba decide si se vuelve a la IA.
      ia:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: false
      # Corte de circuito de la fuente de alertas del IDEAM (DR-16): tras 3 consultas fallidas seguidas, 60 s sin
      # llamarla; las zonas que no se leen conservan sus alertas anteriores.
      alertas:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 100
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: false
