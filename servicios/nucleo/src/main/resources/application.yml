spring:
  application:
    name: nucleo
  datasource:
    # En Docker Compose se sobrescriben con SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME y
    # SPRING_DATASOURCE_PASSWORD. El núcleo siempre usa PostgreSQL; no hay perfil en memoria (DN-03).
    url: jdbc:postgresql://localhost:5432/nucleo_db
    username: nucleo
    password: nucleo-piloto
  jpa:
    # El esquema lo crea Flyway (DN-01); Hibernate solo comprueba que las entidades coinciden con él.
    hibernate:
      ddl-auto: validate
    # Sin consultas abiertas mientras se arma la respuesta: cada caso de uso trae lo que necesita.
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mail:
    # El servidor SMTP (DN-30). En Docker Compose es Mailpit (SPRING_MAIL_HOST=mailpit); fuera de Docker, un Mailpit
    # local en el puerto 1025. Espera como máximo 3 s, como las demás llamadas salientes (RNF-05).
    host: localhost
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  mvc:
    # Errores en formato RFC 7807 (application/problem+json).
    problemdetails:
      enabled: true

server:
  port: 8080
  servlet:
    # Nginx reenvía /api/nucleo/** sin reescribir la ruta; los controladores se mapean sin el prefijo.
    context-path: /api/nucleo

management:
  health:
    mail:
      # Sin correo el núcleo sigue sirviendo: solo falla el restablecimiento de la contraseña, con 503 (DN-30). Así
      # Docker no lo marca como enfermo si Mailpit no responde.
      enabled: false
  endpoints:
    web:
      exposure:
        # La salud, para el healthcheck de Docker Compose, y las métricas. Nginx no deja llegar a /actuator desde
        # fuera.
        include: health,prometheus
  metrics:
    distribution:
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,750ms,1s,1500ms,2s,3s

nucleo:
  cifrado:
    # Clave AES-256 de los datos personales, 32 bytes en Base64 (RNF-08, DN-28). Llega por NUCLEO_CIFRADO_CLAVE y se
    # genera con infra/generar-claves.sh. Sin valor por defecto: sin ella el núcleo no arranca.
    clave:
  jwt:
    # Clave privada RSA del token de acceso, PKCS#8 en Base64 de una línea o en PEM (DN-29). Llega por
    # NUCLEO_JWT_CLAVE_PRIVADA y se genera con infra/generar-claves.sh. Sin valor por defecto: sin ella no arranca.
    clave-privada:
    # El emisor (iss) que los demás servicios exigirán en el token.
    emisor: samarian-tour-nucleo
  correo:
    remitente: Samarian Tour <no-responder@samariantour.co>
  cuentas:
    # La pantalla del frontend que pide la contraseña nueva; {token} es el secreto del enlace (RF-07, DN-30).
    enlace-restablecimiento: http://localhost:8080/restablecer-contrasena?token={token}
  catalogo:
    # La API del catálogo por la red interna; en Docker Compose se sobrescribe con NUCLEO_CATALOGO_URL.
    url: http://localhost:8081/api/catalogo
  bandeja:
    publicacion:
      # Cada 15 s envía al catálogo los avisos pendientes (DN-06). Con "-" no corre.
      cron: "*/15 * * * * *"
  solicitudes:
    vencimiento:
      # Cada minuto aplica los vencimientos de 24 h y de la ventana de pago [SUPUESTO] (DN-14). Con "-" no corre.
      cron: "0 * * * * *"
    notificaciones:
      # Cada 10 s envía las notificaciones de WhatsApp pendientes [SUPUESTO] (DN-13). Con "-" no corre.
      cron: "*/10 * * * * *"
    idempotencia:
      # Cada hora borra las claves de idempotencia vencidas (DN-12). Con "-" no corre.
      cron: "0 0 * * * *"
    # La pantalla de confirmación del frontend que lleva la notificación de Atendida (RF-45) [SUPUESTO] (DN-13).
    enlace-confirmacion: http://localhost:8080/turista/solicitudes/{id}

resilience4j:
  circuitbreaker:
    instances:
      # Corte de circuito de la consulta al catálogo al crear una solicitud (ADR-04, QAS-03, DN-09): tras 5 fallas en
      # las últimas 10 consultas, 30 s sin llamarlo; luego dos consultas de prueba deciden si se cierra [SUPUESTO].
      # Un 404 no cuenta como falla.
      catalogo:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2
        automatic-transition-from-open-to-half-open-enabled: true
