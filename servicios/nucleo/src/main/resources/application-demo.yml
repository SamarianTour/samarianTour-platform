# Perfil demo del núcleo (DN-05, DN-35). Solo para la demostración.

nucleo:
  # Los prestadores de la demo ya son datos de su módulo (PrecargaPrestadoresDemo, DN-35), y los turistas, cuentas
  # (PrecargaCuentasDemo, DN-28). Aquí solo queda lo provisional que todavía no tiene dueño.
  demo:
    # El administrador recibe por WhatsApp los pagos tardíos para reembolsarlos a mano (RF-50, DN-26).
    administrador:
      whatsapp: "+573005550099"

  # La pasarela simulada de la demo (DN-18, DN-24): reintentos de la dispersión cada 10 s, 20 s y 40 s, para mostrarlos
  # sin esperar minutos, y la cuenta del restaurante, que siempre falla.
  pagos:
    dispersion:
      espera-base: 10s
    simulada:
      cuentas-que-fallan:
        - "3001110404"

  # El RNT simulado (DN-33): los registros activos con los números de los prestadores de la demo, que son ficticios.
  # Los campos son los del conjunto del RNT en datos.gov.co. La agencia sin RNT (910005) no está: su RNT se cayó. El
  # 910006 y el 910007 no son de nadie todavía, para mostrar el registro de un prestador nuevo.
