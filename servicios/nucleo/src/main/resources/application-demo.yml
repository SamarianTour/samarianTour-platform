      # Agencia y guía: los atiende el operador 1 (RF-32). La cuenta de cobro vigente de cada uno (RF-74) solo la usa la
      # dispersión (RF-75, DN-26); los números son ficticios.
      - id: 10000000-0000-0000-0000-000000000001
        operador-id: 60000000-0000-0000-0000-000000000001
        whatsapp: "+573001110101"
        cuenta:
          tipo: AHORROS
          entidad: Bancolombia
          numero: "40112233440101"
      - id: 20000000-0000-0000-0000-000000000002
        operador-id: 60000000-0000-0000-0000-000000000001
        whatsapp: "+573001110202"
        cuenta:
          tipo: NEQUI
          entidad: Nequi
          numero: "3001110202"
