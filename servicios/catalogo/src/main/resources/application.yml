spring:
  application:
    name: catalogo
  profiles:
    # Mientras no exista el adaptador de MongoDB, los datos viven en la memoria del proceso (perfil memoria).
    # El perfil demo, que acepta los headers que sustituyen al token, nunca se activa por defecto.
    default: memoria
  data:
    mongodb:
      # En Docker Compose se sobrescribe con SPRING_DATA_MONGODB_URI.
      uri: mongodb://localhost:27017/catalogo_db
  mvc:
    # Errores en formato RFC 7807 (application/problem+json).
    problemdetails:
      enabled: true

server:
  port: 8080
  servlet:
    # Nginx reenvía /api/catalogo/** sin reescribir la ruta; los controladores se mapean sin el prefijo.
    context-path: /api/catalogo

management:
  endpoints:
    web:
      exposure:
        # Solo la salud, para el healthcheck de Docker Compose.
        include: health
