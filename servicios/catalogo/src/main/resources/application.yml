spring:
  application:
    name: catalogo
  profiles:
    # Por defecto los datos viven en la memoria del proceso (perfil memoria); el perfil mongo usa los adaptadores
    # de MongoDB.
    # El perfil demo, que carga los datos de la demostración, nunca se activa por defecto.
    default: memoria
  data:
    mongodb:
      # En Docker Compose se sobrescribe con SPRING_DATA_MONGODB_URI.
      uri: mongodb://localhost:27017/catalogo_db
      # Los UUID de prestadores y turistas se guardan como binario estándar (subtipo 4), no con el formato
      # heredado del driver Java, para que cualquier herramienta los lea igual (DC-16).
      uuid-representation: standard
  mvc:
    # Errores en formato RFC 7807 (application/problem+json).
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Una foto pesa como máximo 5 MB (DC-39); el resto de la petición son unos pocos bytes.
      max-file-size: 5MB
      max-request-size: 6MB

# El token de acceso lo emite el núcleo; el catálogo lo valida con su clave pública, sin consultarlo (DC-01).
seguridad:
  jwt:
    emisor: samarian-tour-nucleo
    # X.509 en Base64; la genera infra/generar-claves.sh. Sin ella el catálogo no arranca.
    clave-publica: ${SEGURIDAD_JWT_CLAVE_PUBLICA:}

server:
  port: 8080
  tomcat:
    # Tomcat lee hasta este tamaño una subida que rechaza, para poder responder el 400 en vez de cortar la conexión.
    max-swallow-size: 10MB
  servlet:
    # Nginx reenvía /api/catalogo/** sin reescribir la ruta; los controladores se mapean sin el prefijo.
    context-path: /api/catalogo

management:
  endpoints:
    web:
      exposure:
        # La salud, para el healthcheck de Docker Compose, y las métricas para medir QAS-07. Nginx no deja llegar a
        # /actuator desde fuera: solo se consultan desde la red de Docker.
        include: health,prometheus
  metrics:
    distribution:
      # Latencia de cada ruta (QAS-07, DC-48): cuántas peticiones respondieron dentro de cada umbral desde el arranque.
      # Los contadores se suman entre réplicas; "p95 <= 2 s" se cumple si al menos el 95 % cae en el de 2 s.
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,750ms,1s,1500ms,2s,3s

catalogo:
  fotos:
    limpieza:
      # Cada hora, en el minuto 17, borra las fotos que pasaron 24 horas sin uso (DC-47). Con "-" no corre.
      cron: "0 17 * * * *"
  carga:
    # Ofertas sintéticas que carga el perfil carga para la prueba de QAS-07 (DC-48).
    ofertas: 5000
